<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy Birthday!</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
}

/* COUNTDOWN SCREEN */
.countdown {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at top, #ff758c, #ff7eb3);
  z-index: 10;
  animation: fadeOut 1s ease forwards;
  animation-delay: 3.5s;
}

.countdown-number {
  font-size: 6rem;
  color: #fff;
  font-weight: bold;
  animation: scaleFade 1s ease-in-out forwards;
}

@keyframes scaleFade {
  0% { transform: scale(0.5); opacity: 0; }
  50% { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(1); opacity: 0; }
}

@keyframes fadeOut {
  to { opacity: 0; visibility: hidden; }
}

/* CARD */
.card {
  background: #ffffff;
  width: 320px;
  padding: 24px;
  border-radius: 24px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

h1 {
  margin: 0 0 12px;
  font-size: 2rem;
  color: #ff5f7e;
}

p {
  font-size: 1rem;
  color: #555;
  line-height: 1.5;
}

.balloons {
  font-size: 2.5rem;
  margin-bottom: 12px;
  animation: pop 2s infinite alternate;
}

@keyframes pop {
  from { transform: scale(1); }
  to { transform: scale(1.1); }
}

.footer {
  margin-top: 16px;
  font-size: 0.9rem;
  color: #888;
}

  </style>
</head>
<body>  <!-- COUNTDOWN -->  <div class="countdown">
    <div class="countdown-number" id="count">3</div>
  </div>  <!-- CARD -->  <div class="card">
    <div class="balloons">🎈🎉🎂</div>
    <h1 class="title">HAPPY BIRTHDAY GEET</h1>
    <p class="subtitle">A beautiful lady was born today ✨</p>
    <button class="surprise-btn" onclick="showSurprise()">Click for a Surprise</button>
    <div class="footer" id="surprise" style="display:none; margin-top:14px;">🎁 May your life be filled with love, joy, and endless smiles 💖</div>
  </div>
    <h1>Happy Birthday!</h1>
    <p>
      Wishing you a day filled with laughter, cake, surprises, and all the good vibes.
      You deserve every amazing moment today brings.
    </p>
    <div class="footer">— With love 💖</div>
  </div>  <script>
    const countEl = document.getElementById('count');
    let count = 3;

    const interval = setInterval(() => {
      count--;
      if (count > 0) {
        countEl.textContent = count;
        countEl.style.animation = 'none';
        void countEl.offsetWidth;
        countEl.style.animation = 'scaleFade 1s ease-in-out forwards';
      } else {
        clearInterval(interval);
        countEl.textContent = '🎉';
      }
    }, 1000);
  </script></body>
</html>
