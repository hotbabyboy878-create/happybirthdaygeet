<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Geet 🎂</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family:Georgia, serif;
  background: radial-gradient(circle at top,#ffe1ec,#ff6f9f);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.screen {
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  width:80%;
  max-width:400px;
}

/* Countdown */
#countdown {
  font-size:96px;
  font-weight:bold;
  color:#ff2f92;
  animation:scaleUp 0.5s ease;
  letter-spacing:8px;
}

@keyframes scaleUp{
  0%{transform:scale(0)}
  50%{transform:scale(1.2)}
  100%{transform:scale(1)}
}

#countdownText {
  font-size:24px;
  color:#ff2f92;
  margin-top:20px;
  opacity:0.8;
}

/* Animations */
@keyframes fadeInText {
  from { opacity: 0; transform: scale(0.5); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>
<body>

<div class="screen" id="start">
  <div id="countdown">5</div>
</div>

<script>
let countdown = 5;
const countdownEl = document.getElementById('countdown');

function startCountdown() {
  const interval = setInterval(() => {
    if(countdown > 1) {
      countdown--;
      countdownEl.innerText = countdown;
    } else {
      clearInterval(interval);
      // After countdown, do something else (add next step later)
    }
  }, 1000);
}

startCountdown();
</script>

</body>
</html>
