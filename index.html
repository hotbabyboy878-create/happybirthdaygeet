<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy Birthday!</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
}

/* COUNTDOWN SCREEN */
.countdown {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at top, #ff758c, #ff7eb3);
  z-index: 10;
}

.countdown-number {
  font-size: 6rem;
  color: #fff;
  font-weight: bold;
  animation: scaleFade 1s ease-in-out forwards;
}

@keyframes scaleFade {
  0% { transform: scale(0.5); opacity: 0; }
  50% { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(1); opacity: 0; }
}

/* CARD */
.card {
  background: #ffffff;
  width: 320px;
  padding: 24px;
  border-radius: 24px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.balloons {
  font-size: 2.5rem;
  margin-bottom: 12px;
}

.title {
  margin: 10px 0 8px;
  font-size: 1.9rem;
  color: #ff5f7e;
  font-weight: bold;
}

.subtitle {
  font-size: 1rem;
  color: #555;
  margin-bottom: 16px;
}

.surprise-btn {
  padding: 10px 16px;
  border-radius: 12px;
  border: none;
  font-size: 1rem;
  cursor: pointer;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  color: white;
}

.footer {
  margin-top: 14px;
  font-size: 0.95rem;
  color: #888;
}

  </style>
</head>
<body>  <!-- COUNTDOWN -->  <div class="countdown" id="countdown">
    <div class="countdown-number" id="count">3</div>
  </div>  <!-- CARD -->  <div class="card">
    <div class="balloons">🎈🎉🎂</div>
    <h1 class="title">HAPPY BIRTHDAY GEET</h1>
    <p class="subtitle">A beautiful lady was born today ✨</p>
    <button class="surprise-btn" onclick="showSurprise()">Click for a Surprise</button>
    <div class="footer" id="surprise" style="display:none;">🎁 May your life be filled with love, joy, and endless smiles 💖</div>
  </div>  <script>
    const countEl = document.getElementById('count');
    const countdown = document.getElementById('countdown');
    let count = 3;

    const interval = setInterval(() => {
      count--;
      if (count > 0) {
        countEl.textContent = count;
        countEl.style.animation = 'none';
        void countEl.offsetWidth;
        countEl.style.animation = 'scaleFade 1s ease-in-out forwards';
      } else {
        clearInterval(interval);
        countdown.style.display = 'none';
      }
    }, 1000);

    function showSurprise() {
      document.getElementById('surprise').style.display = 'block';
    }
  </script></body>
</html>
