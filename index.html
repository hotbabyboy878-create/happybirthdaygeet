<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Cake Test 🎂</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at top,#ffe6ef,#ff6f9f);
  font-family:Georgia, serif;
}

/* ===== CAKE CONTAINER ===== */
.cake-wrap{
  position:relative;
  width:320px;
  height:320px;
}

/* ===== CAKE SHADOW ===== */
.cake-shadow{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:260px;
  height:40px;
  background:rgba(0,0,0,0.25);
  filter:blur(18px);
  border-radius:50%;
}

/* ===== CAKE BODY ===== */
.cake{
  position:absolute;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  width:260px;
  height:160px;
  background:linear-gradient(
    to bottom,
    #f5c2d1 0%,
    #e38aa6 40%,
    #c86b86 100%
  );
  border-radius:0 0 120px 120px;
  box-shadow:
    inset 0 -20px rgba(0,0,0,0.15),
    inset 0 10px rgba(255,255,255,0.25);
}

/* ===== CAKE TOP (ROUND) ===== */
.cake-top{
  position:absolute;
  top:-40px;
  left:0;
  width:100%;
  height:80px;
  background:radial-gradient(
    circle at 30% 30%,
    #fff1f6,
    #ff9bb8
  );
  border-radius:50%;
  box-shadow:
    inset 0 -8px rgba(0,0,0,0.15),
    inset 0 6px rgba(255,255,255,0.4);
}

/* ===== FROSTING EDGE ===== */
.frosting{
  position:absolute;
  top:30px;
  left:0;
  width:100%;
  height:30px;
  background:
    repeating-radial-gradient(
      circle,
      #fff 0 8px,
      #ffe1ec 9px 16px
    );
  border-radius:0 0 60px 60px;
}

/* ===== NAME ON TOP ===== */
.name{
  position:absolute;
  top:18px;
  width:100%;
  text-align:center;
  font-size:26px;
  color:white;
  text-shadow:0 0 20px #ff2f92;
  font-weight:bold;
}

/* ===== CANDLE ===== */
.candle{
  position:absolute;
  top:-95px;
  left:50%;
  transform:translateX(-50%);
  width:20px;
  height:70px;
  background:linear-gradient(
    to bottom,
    #fff1a8,
    #ffb703
  );
  border-radius:10px;
  box-shadow:inset 0 -5px rgba(0,0,0,0.15);
}

/* ===== FLAME ===== */
.flame{
  position:absolute;
  top:-35px;
  left:50%;
  transform:translateX(-50%);
  width:28px;
  height:40px;
  background:radial-gradient(
    circle,
    #fff9c4,
    #ff7b00 70%
  );
  border-radius:50%;
  filter:drop-shadow(0 0 12px #ff8c00);
  animation:flicker 0.25s infinite;
}

/* ===== ANIMATIONS ===== */
@keyframes flicker{
  0%{transform:translateX(-50%) scale(1);}
  50%{transform:translateX(-50%) scale(0.85);}
  100%{transform:translateX(-50%) scale(1);}
}
</style>
</head>

<body>

<div class="cake-wrap">
  <div class="cake-shadow"></div>

  <div class="cake">
    <div class="cake-top">
      <div class="name">Geet 💖</div>
    </div>
    <div class="frosting"></div>
  </div>

  <div class="candle">
    <div class="flame"></div>
  </div>
</div>

</body>
</html>
