<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Geet</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #EEF5F0;
  --card: #BFD8C2;
  --primary: #9CAF88;
  --accent: #7FA58C;
  --text: #2E4A3B;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: 'Montserrat', sans-serif;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

/* TIMER */
#timer3to1 {
  font-size: 6rem;
  font-weight: 600;
  color: var(--primary);
}

/* TEXT */
#birthday-text {
  display: none;
  font-family: 'Playfair Display', serif;
  font-size: 4rem;
  color: var(--primary);
  text-align: center;
}

#sub-text {
  display: none;
  font-size: 1.4rem;
  max-width: 90%;
  text-align: center;
  margin: 15px 0;
}

#second-timer {
  display: none;
  font-size: 2.5rem;
  font-weight: 600;
}

#start-btn {
  display: none;
  margin-top: 25px;
  padding: 15px 35px;
  border-radius: 50px;
  border: none;
  background: var(--accent);
  color: white;
  font-size: 1.3rem;
  font-weight: 600;
  cursor: pointer;
}

/* BOOK */
#book-container {
  display: none;
  width: 85vw;
  max-width: 900px;
  height: 80vh;
  background: var(--card);
  border-radius: 18px;
  padding: 30px 35px;
  overflow: hidden; /* CRITICAL */
}

#page-title {
  font-family: 'Playfair Display', serif;
  font-size: 2.8rem;
  color: var(--primary);
  margin-bottom: 15px;
  text-align: center;
}

/* 🔥 REAL FIX IS HERE */
#page-content {
  height: calc(80vh - 220px); /* LOCKED HEIGHT */
  overflow-y: auto;
  font-size: 1.35rem;
  line-height: 2.2rem;
  padding-right: 12px;
  word-break: break-word;
  white-space: pre-wrap;
}

/* BUTTONS */
.book-buttons {
  margin-top: 18px;
  display: flex;
  justify-content: space-between;
}

.book-buttons button {
  padding: 10px 22px;
  border-radius: 30px;
  border: none;
  background: var(--accent);
  color: white;
  font-weight: 600;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="timer3to1">3</div>

<div id="birthday-text">Happy Birthday Geet</div>

<div id="sub-text">
  Today a beautiful lady was born and her name is Geet and even she is not aware of it
</div>

<div id="second-timer">15</div>

<button id="start-btn">Open Your Surprise</button>

<div id="book-container">
  <h1 id="page-title"></h1>
  <div id="page-content"></div>

  <div class="book-buttons">
    <button onclick="prevPage()">⬅ Previous</button>
    <button onclick="nextPage()">Next ➡</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const timer3to1 = document.getElementById("timer3to1");
const birthdayText = document.getElementById("birthday-text");
const subText = document.getElementById("sub-text");
const secondTimer = document.getElementById("second-timer");
const startBtn = document.getElementById("start-btn");
const book = document.getElementById("book-container");

let count = 3;
const mainTimer = setInterval(() => {
  count--;
  if (count > 0) timer3to1.innerText = count;
  else {
    clearInterval(mainTimer);
    timer3to1.style.display = "none";
    birthdayText.style.display = "block";
    subText.style.display = "block";
    secondTimer.style.display = "block";
    confetti();
    startSecond();
  }
}, 1000);

function startSecond() {
  let s = 15;
  secondTimer.innerText = s;
  const t = setInterval(() => {
    s--;
    if (s >= 0) secondTimer.innerText = s;
    else {
      clearInterval(t);
      startBtn.style.display = "inline-block";
    }
  }, 1000);
}

startBtn.onclick = () => {
  birthdayText.style.display = "none";
  subText.style.display = "none";
  secondTimer.style.display = "none";
  startBtn.style.display = "none";
  book.style.display = "block";
  renderPage();
};

const pages = [
  { title: "Happy Birthday Geet 💖", content: `Hiii Geet Rani Happy Birthday 🎈🎂...` },
  { title: "Why do I love you? 💗", content: `Okay so why do I love you?...` },
  { title: "What can I do for you and who are you to me? 💝", content: `Hey Geet,...` },
  { title: "My Poetries for You ✍🏻", content: `Writing poetries is not easy for me...` },
  { title: "A Wish for You 💗", content: `Geet, On your special day...` },
  { title: "A Note for You 💝", content: `Geet, I know sometimes your heart...` },
];

let i = 0;
const title = document.getElementById("page-title");
const content = document.getElementById("page-content");

function renderPage() {
  title.innerText = pages[i].title;
  content.innerText = pages[i].content;
  content.scrollTop = 0;
}

function nextPage() {
  if (i < pages.length - 1) i++;
  renderPage();
}

function prevPage() {
  if (i > 0) i--;
  renderPage();
}
</script>

</body>
</html>
