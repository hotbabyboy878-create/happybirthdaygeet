<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday 🎂</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  min-height: 100vh;
  font-family: "Georgia", serif;
  background: linear-gradient(135deg, #ffd3a5, #fd6585);
}

/* CENTER FIRST SCREEN */
.center {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* SCROLL SCREEN */
.scroll {
  display: flex;
  justify-content: center;
  padding: 40px 0;
}

.card {
  background: rgba(255,255,255,0.45);
  backdrop-filter: blur(14px);
  padding: 36px;
  border-radius: 32px;
  max-width: 420px;
  width: 90%;
  text-align: center;
  color: #6b1f33;
  box-shadow: 0 30px 60px rgba(200,80,100,0.3);
  animation: fadeIn 1s ease;
  position: relative;
}

h1 {
  font-weight: normal;
  color: #8b1e3f;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  border-radius: 30px;
  border: none;
  background: linear-gradient(to right, #ff7a7a, #ffb199);
  color: white;
  font-size: 17px;
  cursor: pointer;
}

.hidden {
  display: none;
}

/* 🎂 CAKE */
.cake {
  margin: 30px auto;
  width: 200px;
  height: 120px;
  background: #ffb6c1;
  border-radius: 0 0 20px 20px;
  position: relative;
}

.cake::before {
  content: "";
  position: absolute;
  top: -30px;
  left: 0;
  width: 200px;
  height: 40px;
  background: #fff;
  border-radius: 20px;
}

/* 🕯️ CANDLE */
.candle {
  position: absolute;
  top: -60px;
  left: 50%;
  transform: translateX(-50%);
  width: 12px;
  height: 40px;
  background: #ffd700;
  border-radius: 6px;
}

.flame {
  width: 16px;
  height: 22px;
  background: orange;
  border-radius: 50%;
  position: absolute;
  top: -22px;
  left: 50%;
  transform: translateX(-50%);
  animation: flicker 0.3s infinite;
  cursor: pointer;
}

@keyframes flicker {
  0% { transform: translateX(-50%) scale(1); }
  50% { transform: translateX(-50%) scale(1.1); }
  100% { transform: translateX(-50%) scale(1); }
}

/* 🍰 SLICE */
.slice {
  width: 200px;
  height: 120px;
  background: #ffc0cb;
  border-radius: 0 0 20px 20px;
  margin: 20px auto;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<audio id="music" loop>
  <source src="birthday-music.mp3" type="audio/mpeg">
</audio>

<!-- FIRST SCREEN -->
<div class="center" id="start">
  <div class="card">
    <h1>🎉 Happy Birthday Geet Rani 🎂</h1>
    <button onclick="openCard()">Tap to open 🎁</button>
  </div>
</div>

<!-- SECOND SCREEN -->
<div class="scroll hidden" id="message">
  <div class="card">

    <h2>Make a wish ✨</h2>

    <div class="cake" id="cake">
      <div class="candle">
        <div class="flame" id="flame" onclick="blowCandle()"></div>
      </div>
    </div>

    <p id="candleText">Tap the flame to blow the candle 🕯️</p>

    <button id="cutBtn" class="hidden" onclick="cutCake()">Cut the cake 🎂</button>

    <div id="cakeSlice" class="hidden">
      <div class="slice"></div>
      <p>🍰 Cake is cut! May all your wishes come true 💗</p>
    </div>

  </div>
</div>

<script>
function openCard() {
  document.getElementById("start").classList.add("hidden");
  document.getElementById("message").classList.remove("hidden");

  const music = document.getElementById("music");
  music.volume = 0.4;
  music.play().catch(() => {});
}

function blowCandle() {
  const flame = document.getElementById("flame");
  flame.style.display = "none";
  document.getElementById("candleText").innerText =
    "🎉 Candle blown! Your wish is on the way…";
  document.getElementById("cutBtn").classList.remove("hidden");
}

function cutCake() {
  document.getElementById("cake").style.display = "none";
  document.getElementById("cutBtn").style.display = "none";
  document.getElementById("cakeSlice").classList.remove("hidden");
}
</script>

</body>
</html>
