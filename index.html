/* =====================================================
   ACTIVE THEME (CHANGE THIS BLOCK ONLY)

/* 🌹 Sage / Mint */
:root {

* {

}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);

  color: var(--text);

/* TIMER */

}

/* TEXT */

  font-size: 4rem;

  text-align: center;
}

#sub-text {

  font-size: 1.4rem;
  max-width: 90%;
  text-align: center;
  margin: 15px 0;
}

#second-timer {
  display: none;
  font-size: 2.5rem;
  font-weight: 600;
}

/* BUTTON */
#start-btn {
  display: none;
  margin-top: 25px;
  padding: 15px 35px;
  border-radius: 50px;
  border: none;
  background: var(--accent);
  color: white;
  font-size: 1.3rem;
  font-weight: 600;
  cursor: pointer;
}

/* BALLOONS */
.balloon {
  position: absolute;
  bottom: -50px;
  font-size: 2rem;
  animation: floatUp 6s linear forwards;
  z-index: 0;
}

@keyframes floatUp {
  to {
    transform: translateY(-110vh);
    opacity: 0;
  }
}

/* BOOK */
#book-container {
  display: none;
  width: 75vw;
  max-width: 600px;
  height: 60vh;
  background: var(--card);
  border-radius: 16px;
  padding: 30px;
  text-align: center;
}

#page-title {
  font-family: 'Playfair Display', serif;
  font-size: 2.6rem;
  color: var(--primary);
}

#page-content {
  margin-top: 15px;
  font-size: 1.3rem;
  line-height: 2.1rem;
  max-height: 32vh;
  overflow-y: auto;
}

/* BOOK BUTTONS */
.book-buttons {
  margin-top: 20px;
  display: flex;
  justify-content: space-between;
}

.book-buttons button {
  padding: 10px 22px;
  border-radius: 30px;
  border: none;
  background: var(--accent);
  color: white;
  font-weight: 600;
  cursor: pointer;
}

</style>
</head>

<body>

<div id="timer3to1">3</div>

<div id="sub-text">
  Today a beautiful lady was born and her name is Geet and even she is not aware of it

<div id="book-container">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const timer3to1 = document.getElementById("timer3to1");
const birthdayText = document.getElementById("birthday-text");
const subText = document.getElementById("sub-text");
const secondTimer = document.getElementById("second-timer");
const startBtn = document.getElementById("start-btn");
const book = document.getElementById("book-container");

let count = 3;
const mainTimer = setInterval(() => {
  count--;
  if (count > 0) timer3to1.innerText = count;
  else {
    clearInterval(mainTimer);
    timer3to1.style.display = "none";
    birthdayText.style.display = "block";
    subText.style.display = "block";
    secondTimer.style.display = "block";
    confetti();
    balloons();
    startSecond();
  }
}, 1000);

function startSecond() {
  let s = 15;
  secondTimer.innerText = s;
  const t = setInterval(() => {
    s--;
    if (s >= 0) secondTimer.innerText = s;
    else {
      clearInterval(t);
      startBtn.style.display = "inline-block";
    }
  }, 1000);
}

startBtn.onclick = () => {
  birthdayText.style.display = "none";
  subText.style.display = "none";
  secondTimer.style.display = "none";
  startBtn.style.display = "none";
  book.style.display = "block";
  renderPage();
};

function balloons() {
  setInterval(() => {
    const b = document.createElement("div");
    b.className = "balloon";
    b.innerHTML = "🎈";
    b.style.left = Math.random() * 90 + "vw";
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 6000);
  }, 500);
}

let i = 0;
const title = document.getElementById("page-title");
const content = document.getElementById("page-content");

function renderPage() {
  title.innerText = pages[i].title;
  content.innerText = pages[i].content;
  content.scrollTop = 0;
}

function nextPage() {
  if (i < pages.length - 1) i++;
  renderPage();
}

function prevPage() {
  if (i > 0) i--;
  renderPage();
}
