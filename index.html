<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Geet 🎂</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  min-height:100vh;
  font-family:Georgia, serif;
  background: radial-gradient(circle at top, #ffe1ec, #ff6f9f);
  overflow-x:hidden;
}

/* CENTER SCREENS */
.center{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 0;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.45);
  backdrop-filter:blur(18px);
  padding:36px;
  border-radius:36px;
  width:90%;
  max-width:420px;
  text-align:center;
  box-shadow:0 40px 80px rgba(200,70,120,0.4);
  animation:fadeIn 1s ease;
}

/* BUTTONS */
button{
  width:100%;
  margin-top:24px;
  padding:16px;
  border:none;
  border-radius:40px;
  font-size:17px;
  background:linear-gradient(135deg,#ff4f9a,#ff85b3);
  color:white;
  cursor:pointer;
}

.hidden{display:none}

/* 🎂 CAKE */
.cake{
  position:relative;
  width:240px;
  margin:50px auto 20px;
}

.layer{
  height:55px;
  background:linear-gradient(to right,#ffb3c6,#ff7aa2);
  border-radius:22px;
  margin-bottom:6px;
}

.icing{
  height:28px;
  background:#fff;
  border-radius:22px;
  margin-bottom:6px;
}

/* 💖 NAME ON CAKE */
.name{
  position:absolute;
  top:18px;
  width:100%;
  text-align:center;
  font-size:24px;
  color:#ff2f92;
  text-shadow:0 0 14px #ff2f92;
  animation:glow 1.6s infinite alternate;
}

/* 🕯️ CANDLE */
.candle{
  position:absolute;
  top:-65px;
  left:50%;
  transform:translateX(-50%);
  width:18px;
  height:55px;
  background:linear-gradient(#ffe066,#ffb703);
  border-radius:10px;
}

.flame{
  position:absolute;
  top:-30px;
  left:50%;
  transform:translateX(-50%);
  width:22px;
  height:30px;
  background:radial-gradient(circle,#fff4c2,#ff7b00);
  border-radius:50%;
  animation:flicker .25s infinite;
}

/* 🔪 KNIFE */
.knife{
  position:absolute;
  right:-130px;
  top:90px;
  width:120px;
  height:10px;
  background:#ddd;
  border-radius:6px;
  display:none;
  animation:cut 2s forwards;
}

/* 🎊 CONFETTI */
.confetti{
  position:fixed;
  top:-10px;
  width:10px;
  height:14px;
  animation:fall 4s linear forwards;
}

/* MESSAGE PAGE */
.message{
  max-height:60vh;
  overflow-y:auto;
  text-align:left;
  line-height:1.7;
  color:#5a1a2c;
}

/* ANIMATIONS */
@keyframes fadeIn{
  from{opacity:0;transform:scale(.95)}
  to{opacity:1;transform:scale(1)}
}
@keyframes glow{
  from{text-shadow:0 0 10px #ff2f92}
  to{text-shadow:0 0 26px #ff2f92}
}
@keyframes flicker{
  0%{transform:translateX(-50%) scale(1)}
  50%{transform:translateX(-50%) scale(.85)}
  100%{transform:translateX(-50%) scale(1)}
}
@keyframes cut{
  to{right:60px}
}
@keyframes fall{
  to{transform:translateY(120vh) rotate(360deg)}
}
</style>
</head>

<body>

<!-- MUSIC -->
<audio id="music1" loop>
  <source src="calm.mp3" type="audio/mpeg">
</audio>
<audio id="music2">
  <source src="celebration.mp3" type="audio/mpeg">
</audio>

<!-- START -->
<div class="center" id="start">
  <div class="card">
    <h1>🎉 Happy Birthday Geet 🎉</h1>
    <p>Tap to open 🎂</p>
    <button onclick="openCake()">Open</button>
  </div>
</div>

<!-- CAKE -->
<div class="center hidden" id="cakePage">
  <div class="card">
    <h2>Blow the candle 🕯️</h2>

    <div class="cake">
      <div class="name">Geet 💖</div>

      <div class="candle">
        <div class="flame" id="flame"></div>
      </div>

      <div class="icing"></div>
      <div class="layer"></div>
      <div class="icing"></div>
      <div class="layer"></div>

      <div class="knife" id="knife"></div>
    </div>

    <p id="hint">Blow into your mic 🎤</p>
    <button id="cutBtn" class="hidden" onclick="cutCake()">Cut the Cake 🎂</button>
  </div>
</div>

<!-- MESSAGE PAGE -->
<div class="center hidden" id="messagePage">
  <div class="card">
    <h2>💖 For You</h2>
    <div class="message">
      <p>
        <!-- WRITE YOUR MESSAGE HERE -->
        Happy Birthday Geet ❤️  
        (Write your full message here…)
      </p>
    </div>
  </div>
</div>

<script>
let blown=false, audioCtx, analyser, mic;

function openCake(){
  start.style.display="none";
  cakePage.classList.remove("hidden");
  music1.play();
  startMic();
}

function startMic(){
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    audioCtx=new AudioContext();
    analyser=audioCtx.createAnalyser();
    mic=audioCtx.createMediaStreamSource(stream);
    mic.connect(analyser);
    analyser.fftSize=256;
    detectBlow();
  });
}

function detectBlow(){
  const data=new Uint8Array(analyser.frequencyBinCount);
  function check(){
    analyser.getByteFrequencyData(data);
    let volume=data.reduce((a,b)=>a+b)/data.length;
    if(volume>60 && !blown){
      blown=true;
      candleOut();
    }
    requestAnimationFrame(check);
  }
  check();
}

function candleOut(){
  flame.style.display="none";
  music1.pause();
  music2.play();
  confetti();
  cutBtn.classList.remove("hidden");
}

function cutCake(){
  knife.style.display="block";
  setTimeout(()=>{
    cakePage.style.display="none";
    messagePage.classList.remove("hidden");
  },2000);
}

function confetti(){
  for(let i=0;i<80;i++){
    let c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=`hsl(${Math.random()*360},100%,60%)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4000);
  }
}
</script>

</body>
</html>
