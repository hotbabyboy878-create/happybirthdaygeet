<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Aapi</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#EEF5F0;
  --card:#BFD8C2;
  --primary:#9CAF88;
  --accent:#7FA58C;
  --text:#2E4A3B;
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  width:100%;
  height:100%;
  background:var(--bg);
  font-family:'Montserrat',sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  overflow:hidden;
}

/* TIMER */
#timer3to1{font-size:6rem;color:var(--primary);}

/* TEXT */
#birthday-text{
  display:none;
  font-family:'Playfair Display',serif;
  font-size:4rem;
  color:var(--primary);
  text-align:center;
}
#sub-text{
  display:none;
  font-size:1.4rem;
  text-align:center;
  margin:15px;
}
#second-timer{display:none;font-size:2.5rem}

/* BUTTON */
#start-btn{
  display:none;
  margin-top:25px;
  padding:15px 35px;
  border:none;
  border-radius:50px;
  background:var(--accent);
  color:#fff;
  font-size:1.3rem;
  cursor:pointer;
}

/* BALLOONS */
.balloon{
  position:absolute;
  bottom:-50px;
  font-size:2rem;
  animation:floatUp 6s linear forwards;
}
@keyframes floatUp{
  to{transform:translateY(-110vh);opacity:0;}
}

/* CONTAINERS */
.container{
  display:none;
  width:75vw;
  max-width:600px;
  height:60vh;
  background:var(--card);
  border-radius:16px;
  padding:20px;
  text-align:center;
  flex-direction:column;
}

h1{
  font-family:'Playfair Display',serif;
  color:var(--primary);
  font-size:2.6rem;
}

/* IMAGE FIXED RATIO */
.memory-image{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:16px;
  background:#00000010;
}

/* BUTTONS */
.book-buttons{
  margin-top:15px;
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.book-buttons button{
  padding:10px 18px;
  border:none;
  border-radius:30px;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="timer3to1">3</div>
<div id="birthday-text">Happy Birthday Aapi 🎉</div>
<div id="sub-text">Today a beautiful soul was born — my Aapi 💖</div>
<div id="second-timer">15</div>
<button id="start-btn">Open Your Surprise</button>

<!-- MEMORIES -->
<div id="memories" class="container">
  <h1>Beautiful 😍</h1>
  <img id="memory-image" class="memory-image">
  <div class="book-buttons">
    <button onclick="prevMemory()">⬅</button>
    <button onclick="nextMemory()">➡</button>
    <button onclick="nextSurprise()">Next Surprise 🎁</button>
  </div>
</div>

<!-- BOOK -->
<div id="book" class="container">
  <h1 id="page-title"></h1>
  <div id="page-content" style="overflow:auto;"></div>
  <div class="book-buttons">
    <button onclick="prevPage()">⬅</button>
    <button onclick="nextPage()">➡</button>
  </div>
</div>

<!-- SONGS -->
<audio id="song-hbd">
  <source src="HAPPY_BIRTHDAY.m4a">
</audio>

<audio id="song-soft" loop>
  <source src="SOFT_MEMORY_SONG.m4a">
</audio>

<audio id="song-final" loop>
  <source src="FINAL_GIFT_SONG.m4a">
</audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const timer=document.getElementById("timer3to1");
const startBtn=document.getElementById("start-btn");
const birthdayText=document.getElementById("birthday-text");
const subText=document.getElementById("sub-text");
const secondTimer=document.getElementById("second-timer");

const memories=document.getElementById("memories");
const book=document.getElementById("book");
const memoryImage=document.getElementById("memory-image");

const songHBD=document.getElementById("song-hbd");
const songSoft=document.getElementById("song-soft");
const songFinal=document.getElementById("song-final");

/* COUNTDOWN */
let c=3;
const interval=setInterval(()=>{
  c--;
  timer.innerText=c;
  if(c===0){
    clearInterval(interval);
    timer.style.display="none";
    birthdayText.style.display="block";
    subText.style.display="block";
    secondTimer.style.display="block";
    confetti();
    balloons();
    songHBD.play();
    let s=15;
    const t=setInterval(()=>{
      s--;
      secondTimer.innerText=s;
      if(s<0){
        clearInterval(t);
        startBtn.style.display="inline-block";
      }
    },1000);
  }
},1000);

/* MEMORY IMAGES */
const images=[
 "IMG1.jpg","IMG2.jpg","IMG3.jpg","IMG4.jpg","IMG5.jpg",
 "IMG6.jpg","IMG7.jpg","IMG8.jpg","IMG9.jpg","IMG10.jpg",
 "IMG11.jpg","IMG12.jpg","IMG13.jpg","IMG14.jpg","IMG15.jpg"
];
let mi=0;

function renderMemory(){memoryImage.src=images[mi];}
function nextMemory(){if(mi<images.length-1)mi++;renderMemory();}
function prevMemory(){if(mi>0)mi--;renderMemory();}

/* OPEN MEMORIES */
startBtn.onclick=()=>{
  birthdayText.style.display="none";
  subText.style.display="none";
  secondTimer.style.display="none";
  startBtn.style.display="none";

  memories.style.display="flex";
  renderMemory();

  songHBD.pause();
  songSoft.play();
};

/* NEXT SURPRISE */
function nextSurprise(){
  songSoft.pause();
  songFinal.play();
  memories.style.display="none";
  book.style.display="flex";
  renderPage();
}

/* BOOK */
const pages = [
  {
    title: "Happy Birthday Aapi 💖",
    content: `Hiii my dearest Aapi 🎂🎈
Happy Birthday to someone who may not be connected to me by blood,
but is deeply connected to my heart.
People say family is defined by blood,
but you proved to me that family is actually defined by love, care, and presence.
You are my sister not because life decided it for us,
but because my heart chose you.
Today is your special day, and I want you to know how incredibly grateful I am to have you in my life.
You are someone who came into my life quietly, but stayed in a way that changed me forever.
Your presence has brought warmth, comfort, and strength to my journey.
This little gift is my way of saying thank you —
thank you for existing,
thank you for caring,
and thank you for being my Aapi.`
  },
  {
    title: "My Sister by Heart 🤍",
    content: `Aapi,
You are not my sister by blood, but you are my sister by heart,
and that bond feels stronger than many blood relationships.
What we share is something pure, genuine, and deeply meaningful to me.
You chose to care for me, to support me, and to stand by me —
and that choice means everything.
You became someone I trust, someone I respect,
and someone I feel safe around.
You didn’t have to do anything for me, yet you did so much.
You didn’t owe me your time, yet you gave it generously.
You didn’t have to believe in me, yet you always did.
That is why you are my sister —
not by chance, but by choice.`
  },
  {
    title: "Thank You for Being There 🌸",
    content: `Aapi,
There are moments in life when support matters more than words,
and you were always there in those moments.
You supported me when I felt unsure.
You stood by me when things were difficult.
You helped me feel less alone without ever making me feel weak.
Thank you for listening to me patiently.

Thank you for guiding me when I felt lost.
Every small thing you did for me mattered.
Every word of encouragement,
every moment of concern,
every silent act of care —
I noticed it all, and I carry it with me every day.
I am truly thankful for everything you have done for me,
from the smallest gesture to the biggest support.`
  },
  {
    title: "You Changed Me 💫",
    content: `Aapi,
You may not realize this, but your support has played a big role
in shaping the person I am becoming.
When I doubted myself, you reminded me of my worth.
When I felt low, you helped me stand again.
You didn’t try to control my path —
you trusted me.
You didn’t pressure me —
you encouraged me.
You didn’t judge me —
you understood me.
That kind of support is rare.
It comes from a good heart, and yours is truly special.
I have learned so much from you —
about patience, kindness, and strength.
Because of you, I learned that real support doesn’t make noise.
It stays, it listens, and it lifts quietly.`
  },
  {
    title: "I Admire You So Much 🤍",
    content: `Aapi,
I admire you more than I can express in words.
I admire your strength, your maturity,
and the way you handle responsibilities with grace.
You carry so much,
yet you still manage to care for others with kindness.
You are strong even when life is heavy.
You are calm even when things are stressful.
You are kind even when the world isn’t always kind back.
I want you to know that you are deeply respected,
deeply valued,
and deeply appreciated.

and success in every part of your life.

You are doing better than you think,
and you are more amazing than you realize.`
  },
  {
    title: "A Promise From My Heart 💖",
    content: `Aapi,
Just like you chose to support me,
I choose to always stand by you.
This is my promise —
not out of obligation,
but out of love and gratitude.
No matter where life takes us,
you will always have someone who cares for you,
who respects you,
and who wishes the best for you.
If you ever need someone to listen,
to support,
or to simply be there —
I will be there.
You may not be my blood-related sister,
but you are my family in the truest sense.
And family is not about genetics —
it’s about loyalty, care, and love.
I will always be thankful to life
for bringing you into my journey.`
  },
  {
    title: "Once Again 🎉",
    content: `Happy Birthday once again, my dear Aapi 💖
I wish you a life filled with peace,
happiness,
and success.
I wish you good health,
calm days,
and nights filled with contentment.
I wish you people who value you,
respect you,
and treat you with the love you deserve.
May your kindness return to you multiplied.
May your efforts never go unnoticed.
May your heart always feel light and safe.
Thank you for being my sister by heart.
Thank you for being my strength.
Thank you for being you.
With endless love, respect, and gratitude,
— Vishal 🤍`
  }
];
let i=0;
const title=document.getElementById("page-title");
const content=document.getElementById("page-content");

function renderPage(){
  title.innerText=pages[i].title;
  content.innerText=pages[i].content;
}
function nextPage(){if(i<pages.length-1)i++;renderPage();}
function prevPage(){if(i>0)i--;renderPage();}

/* BALLOONS */
function balloons(){
  setInterval(()=>{
    const b=document.createElement("div");
    b.className="balloon";
    b.innerText="🎈";
    b.style.left=Math.random()*90+"vw";
    document.body.appendChild(b);
    setTimeout(()=>b.remove(),6000);
  },500);
}
</script>

</body>
</html>
