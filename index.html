<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Geet!</title>
<link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#111; font-family:'Poppins', sans-serif; display:flex; justify-content:center; align-items:center; flex-direction:column; color:#fff; }

  /* Countdown and text */
  #timer3to1 { font-size:6rem; text-shadow:2px 2px 20px #ff69b4; display:block; }
  #birthday-text { font-family:'Sacramento', cursive; font-size:4rem; color:#ff69b4; text-shadow:2px 2px 15px #ff69b4; display:none; text-align:center; margin-bottom:10px; }
  #sub-text { font-size:1.8rem; text-align:center; color:#fff; text-shadow:1px 1px 5px #ff69b4; display:none; margin-bottom:20px; max-width:90vw; }
  #second-timer { font-size:2.5rem; text-shadow:1px 1px 10px #ff69b4; display:none; margin-bottom:30px; }
  #start-btn { display:none; padding:15px 30px; font-size:1.5rem; border:none; border-radius:50px; cursor:pointer; font-weight:bold; background:linear-gradient(45deg,#ff69b4,#ff4500); box-shadow:0 0 20px #ff69b4; transition:0.3s; }
  #start-btn:hover { transform:scale(1.1); box-shadow:0 0 40px #ff4500; }

  #confetti-canvas { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999; }

  /* Balloons */
  .balloon { position:absolute; bottom:0; animation:floatUp 6s linear forwards; font-size:2rem; }
  @keyframes floatUp { 0% { transform:translateY(0) rotate(0deg); opacity:1; } 100% { transform:translateY(-100vh) rotate(360deg); opacity:0; } }

  /* Cake Container */
  #cake-container { display:none; flex-direction:column; align-items:center; margin-top:20px; }

  /* Cake Layers */
  .cake-layer { position:relative; border-radius:20px; margin-top:-10px; box-shadow:0 0 20px rgba(255,255,255,0.2); }
  .layer1 { width:250px; height:60px; background:linear-gradient(to bottom,#ff6fbf,#ff4081); }
  .layer2 { width:200px; height:50px; background:linear-gradient(to bottom,#ff99cc,#ff66aa); }
  .layer3 { width:150px; height:40px; background:linear-gradient(to bottom,#ffc0cb,#ff80aa); border-radius:15px; }

  /* Candles */
  .candle { width:10px; height:30px; background:#fff; position:absolute; top:-30px; left:50%; transform:translateX(-50%); border-radius:3px; }
  .flame { width:10px; height:15px; background:orange; border-radius:50%; position:absolute; top:-15px; left:0; animation:flameFlicker 0.5s infinite alternate; box-shadow:0 0 10px yellow; }
  @keyframes flameFlicker { 0%{ transform:scale(1) } 100%{ transform:scale(1.5) } }

  /* Sprinkles */
  .sprinkle { width:6px; height:6px; border-radius:50%; position:absolute; }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div id="timer3to1">3</div>
<div id="birthday-text">Happy Birthday Geet! 🎉</div>
<div id="sub-text">Today a beautiful lady was born and her name is Geet and even she is not aware of it</div>
<div id="second-timer">15</div>
<button id="start-btn">✨ Open Your Surprise ✨</button>

<!-- Cake -->
<div id="cake-container">
  <div class="cake-layer layer1"><div class="candle"><div class="flame"></div></div></div>
  <div class="cake-layer layer2"><div class="candle"><div class="flame"></div></div></div>
  <div class="cake-layer layer3"><div class="candle"><div class="flame"></div></div></div>
</div>

<audio id="bg-music" src="birthday-song.mp3" loop></audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
  const timer3to1 = document.getElementById('timer3to1');
  const birthdayText = document.getElementById('birthday-text');
  const subText = document.getElementById('sub-text');
  const secondTimer = document.getElementById('second-timer');
  const startBtn = document.getElementById('start-btn');
  const bgMusic = document.getElementById('bg-music');
  const cakeContainer = document.getElementById('cake-container');

  // 3-2-1 Countdown
  let count = 3;
  const countdownInterval = setInterval(() => {
    count--;
    if(count > 0) timer3to1.innerText = count;
    else {
      clearInterval(countdownInterval);
      timer3to1.style.display = 'none';
      showBirthday();
    }
  },1000);

  function showBirthday() {
    birthdayText.style.display = 'block';
    subText.style.display = 'block';
    secondTimer.style.display = 'block';
    launchConfetti();
    spawnBalloons();
    let secCount = 15;
    secondTimer.innerText = secCount;
    const secInterval = setInterval(() => {
      secCount--;
      if(secCount >= 0) secondTimer.innerText = secCount;
      else {
        clearInterval(secInterval);
        startBtn.style.display = 'inline-block';
      }
    },1000);
  }

  startBtn.onclick = () => {
    birthdayText.style.display = 'none';
    subText.style.display = 'none';
    secondTimer.style.display = 'none';
    startBtn.style.display = 'none';
    bgMusic.play();
    cakeContainer.style.display = 'flex';
    launchConfetti();
    spawnBalloons();
    addSprinkles();
  };

  // Confetti
  function launchConfetti(){
    const duration = 5*1000;
    const animationEnd = Date.now() + duration;
    const defaults = { startVelocity:30, spread:360, ticks:60, zIndex:999 };
    const interval = setInterval(()=>{
      const timeLeft = animationEnd - Date.now();
      if(timeLeft <= 0) return clearInterval(interval);
      const particleCount = 50 * (timeLeft/duration);
      confetti({...defaults, particleCount, origin:{x:Math.random(),y:Math.random()-0.2}});
    },250);
  }

  // Balloons from bottom
  function spawnBalloons(){
    setInterval(()=>{
      const balloon = document.createElement('div');
      balloon.className='balloon';
      balloon.style.left=Math.random()*90+'vw';
      balloon.style.fontSize=Math.random()*20+20+'px';
      balloon.innerHTML='🎈';
      document.body.appendChild(balloon);
      setTimeout(()=>balloon.remove(),6000);
    },500);
  }

  // Sprinkles
  function addSprinkles(){
    const colors = ['#ff0','#f0f','#0ff','#0f0','#fff'];
    const layers = document.querySelectorAll('.cake-layer');
    layers.forEach(layer=>{
      for(let i=0;i<20;i++){
        const s = document.createElement('div');
        s.className='sprinkle';
        s.style.background = colors[Math.floor(Math.random()*colors.length)];
        s.style.top = Math.random()*layer.offsetHeight+'px';
        s.style.left = Math.random()*layer.offsetWidth+'px';
        layer.appendChild(s);
      }
    });
  }

</script>
</body>
</html>
