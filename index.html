<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday!</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
}

.card {
  background: #ffffff;
  width: 320px;
  padding: 24px;
  border-radius: 24px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

h1 {
  margin: 0 0 12px;
  font-size: 2rem;
  color: #ff5f7e;
}

p {
  font-size: 1rem;
  color: #555;
  line-height: 1.5;
}

.balloons {
  font-size: 2.5rem;
  margin-bottom: 12px;
  animation: pop 2s infinite alternate;
}

@keyframes pop {
  from { transform: scale(1); }
  to { transform: scale(1.1); }
}

.footer {
  margin-top: 16px;
  font-size: 0.9rem;
  color: #888;
}

  </style>
</head>
<body>
  <div class="card">
    <div class="balloons">🎈🎉🎂</div>
    <h1>Happy Birthday!</h1>
    <p>
      Wishing you a day filled with laughter, cake, surprises, and all the good vibes.
      You deserve every amazing moment today brings.
    </p>
    <div class="footer">— With love 💖</div>
  </div>
</body>
</html>
