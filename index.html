<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Geet</title>

<link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Poppins:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #F4C2D7; /* blush pink */
  font-family: 'Poppins', sans-serif;
  color: #2b2b2b;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

/* TEXT */
#timer3to1 {
  font-size: 6rem;
  text-shadow: 0 0 20px #e99abf;
}

#birthday-text {
  display: none;
  font-family: 'Sacramento', cursive;
  font-size: 4rem;
  color: #c94f8d;
  text-align: center;
  margin-bottom: 10px;
}

#sub-text {
  display: none;
  font-size: 1.6rem;
  text-align: center;
  max-width: 90vw;
  margin-bottom: 20px;
}

#second-timer {
  display: none;
  font-size: 2.5rem;
  margin-bottom: 30px;
}

/* BUTTON */
#start-btn {
  display: none;
  padding: 15px 35px;
  font-size: 1.4rem;
  border: none;
  border-radius: 50px;
  background: linear-gradient(45deg, #EFB3CC, #F6CCD9);
  color: #2b2b2b;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 20px #e7a7c5;
}

#start-btn:hover {
  transform: scale(1.05);
}

/* BALLOONS */
.balloon {
  position: absolute;
  bottom: 0;
  font-size: 2rem;
  animation: floatUp 6s linear forwards;
  z-index: 0;
}

@keyframes floatUp {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-110vh); opacity: 0; }
}

/* BOOK */
#book-container {
  display: none;
  width: 70vw;
  max-width: 600px;
  height: 60vh;
  background: #FBE4EC;
  border-radius: 12px;
  padding: 30px;
  box-shadow: 0 0 40px rgba(201,79,141,0.3);
  z-index: 1;
  text-align: center;
}

#page-title {
  font-family: 'Sacramento', cursive;
  font-size: 3rem;
  color: #c94f8d;
  margin-bottom: 15px;
}

#page-content {
  font-size: 1.4rem;
  line-height: 2.2rem;
  max-height: 32vh;
  overflow-y: auto;
  padding-right: 10px;
  color: #2b2b2b;
}

/* BOOK BUTTONS */
.book-buttons {
  margin-top: 20px;
  display: flex;
  justify-content: space-between;
}

.book-buttons button {
  padding: 10px 22px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  background: linear-gradient(45deg, #EFB3CC, #F6CCD9);
  color: #2b2b2b;
  font-weight: bold;
  box-shadow: 0 0 15px #e7a7c5;
}

.book-buttons button:hover {
  transform: scale(1.05);
}
</style>
</head>

<body>

<div id="timer3to1">3</div>

<div id="birthday-text">Happy Birthday Geet 🎉</div>
<div id="sub-text">
  Today a beautiful lady was born and her name is Geet and even she is not aware of it
</div>
<div id="second-timer">15</div>

<button id="start-btn">✨ Open Your Surprise ✨</button>

<div id="book-container">
  <h1 id="page-title"></h1>
  <div id="page-content"></div>

  <div class="book-buttons">
    <button onclick="prevPage()">⬅ Previous</button>
    <button onclick="nextPage()">Next ➡</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const timer3to1 = document.getElementById("timer3to1");
const birthdayText = document.getElementById("birthday-text");
const subText = document.getElementById("sub-text");
const secondTimer = document.getElementById("second-timer");
const startBtn = document.getElementById("start-btn");
const bookContainer = document.getElementById("book-container");

let count = 3;
const countdown = setInterval(() => {
  count--;
  if (count > 0) {
    timer3to1.innerText = count;
  } else {
    clearInterval(countdown);
    timer3to1.style.display = "none";
    birthdayText.style.display = "block";
    subText.style.display = "block";
    secondTimer.style.display = "block";
    launchConfetti();
    spawnBalloons();
    startSecondTimer();
  }
}, 1000);

function startSecondTimer() {
  let sec = 15;
  secondTimer.innerText = sec;
  const t = setInterval(() => {
    sec--;
    if (sec >= 0) secondTimer.innerText = sec;
    else {
      clearInterval(t);
      startBtn.style.display = "inline-block";
    }
  }, 1000);
}

startBtn.onclick = () => {
  birthdayText.style.display = "none";
  subText.style.display = "none";
  secondTimer.style.display = "none";
  startBtn.style.display = "none";
  bookContainer.style.display = "block";
  renderPage();
};

function launchConfetti() {
  confetti({
    particleCount: 200,
    spread: 360,
    origin: { y: 0.6 }
  });
}

function spawnBalloons() {
  setInterval(() => {
    const b = document.createElement("div");
    b.className = "balloon";
    b.innerHTML = "🎈";
    b.style.left = Math.random() * 90 + "vw";
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 6000);
  }, 500);
}

const pages = [
  {
    title: "Happy Birthday Geet 💖",
    content: `Hiii Geet Rani Happy Birthday 🎈🎂, How aree youu Geet? I hope you are fine and doing well. I have made this website to wish you a very happy birthday and this is the only way to wish you and one of my favorite way to wish you, so Happy Birthday Geet. Always stay happy and keep smiling because you look even more beautiful when you are smiling..
And I will always pray for your betterment, success. Goodluck for the Board Exams.`
  },
  {
    title: "Why do I love you? 💗",
    content: `Okay so why do I love you? This time I'm saying this openly last time I said that I liked you but actually I love you and It's not only because that you are beautiful there are many reasons and the very main reason is that you are the first girl in my life whom I love and first love cannot be forgotten. You know the backstory that where I first saw you then fell in love with you but couldn't tell you that I was in love with you and then someone else stole you from mee and that's where I was heartbroken for the first time ever in my life and I still think that it was all my fault that I should have told you about it but I was too scared even I'm scared right now making this gift for you but I don't wanna lose you this time that's why I'm doing all this for you.
I was so deeply in love with you that I used to find ways to impress you and make you happy when we were in 5th standard, and one day a friend of mine was telling me a poetry and that was the (mandir wali shayari) I liked it a lot and I remembered it in 2022 and then I used to tell this poetry all the time to everyone and I was so shocked that how much people like poetries and if I write poetries for you, you would be impressed by me. But our classes got separated and I couldn't tell the poetry but I used to read the poetries in front my friends which I wrote for you.
And our classes got combined in 9th but at that time I was so scared to read it for you and I was kinda busy in my personal life and then I got to know that someone else has stolen you from me.`
  },
  {
    title: "What can I do for you and who are you to me? 💝",
    content: `Yeh bana rha hu abhi`
  },
  {
    title: "A Wish For You 🎉",
    content: "May your life be filled with love, laughter, dreams fulfilled, and happiness beyond measure."
  }
];

let currentPage = 0;
const pageTitle = document.getElementById("page-title");
const pageContent = document.getElementById("page-content");

function renderPage() {
  pageTitle.innerText = pages[currentPage].title;
  pageContent.innerText = pages[currentPage].content;
  pageContent.scrollTop = 0;
}

function nextPage() {
  if (currentPage < pages.length - 1) {
    currentPage++;
    renderPage();
  }
}

function prevPage() {
  if (currentPage > 0) {
    currentPage--;
    renderPage();
  }
}
</script>

</body>
</html>
