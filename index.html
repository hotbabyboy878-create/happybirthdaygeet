<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Geet 🎂</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  height:100vh;
  font-family:Georgia, serif;
  background: radial-gradient(circle at top, #ffe1ec, #ff6f9f);
  overflow:hidden;
}

.screen{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  background:rgba(255,255,255,0.45);
  backdrop-filter:blur(18px);
  padding:36px;
  border-radius:36px;
  width:90%;
  max-width:420px;
  text-align:center;
  box-shadow:0 40px 80px rgba(200,70,120,0.4);
  animation:fadeIn 1s ease;
}

button{
  width:100%;
  margin-top:24px;
  padding:16px;
  border:none;
  border-radius:40px;
  font-size:17px;
  background:linear-gradient(135deg,#ff4f9a,#ff85b3);
  color:white;
  cursor:pointer;
}

.hidden{display:none}

/* 🎂 UPGRADED CAKE */
.cake{
  position:relative;
  width:280px;
  margin:70px auto 20px;
}

/* TOP LAYER */
.top{
  position:relative;
  height:70px;
  background:linear-gradient(to right,#ff9ebc,#ff6f9f);
  border-radius:30px 30px 20px 20px;
  box-shadow:inset 0 -6px rgba(255,255,255,0.3);
}

/* NAME ON CAKE */
.name{
  position:absolute;
  top:18px;
  width:100%;
  text-align:center;
  font-size:26px;
  color:white;
  text-shadow:0 0 18px #ff2f92;
  animation:glow 1.6s infinite alternate;
}

/* DRIPS */
.drips span{
  position:absolute;
  bottom:-18px;
  width:18px;
  background:#fff;
  border-radius:0 0 12px 12px;
}
.drips span:nth-child(1){left:40px;height:22px}
.drips span:nth-child(2){left:90px;height:30px}
.drips span:nth-child(3){left:150px;height:24px}
.drips span:nth-child(4){left:200px;height:28px}

/* BODY */
.body{
  height:120px;
  background:linear-gradient(to right,#6b3f2a,#4a2c1f);
  border-radius:0 0 30px 30px;
  box-shadow:inset 0 -10px rgba(0,0,0,0.15);
}

/* STAND */
.stand{
  width:180px;
  height:18px;
  background:#ddd;
  margin:10px auto 0;
  border-radius:50%;
  box-shadow:0 8px 16px rgba(0,0,0,0.25);
}

/* 🕯️ CANDLE */
.candle{
  position:absolute;
  top:-65px;
  left:50%;
  transform:translateX(-50%);
  width:18px;
  height:60px;
  background:linear-gradient(#ffe066,#ffb703);
  border-radius:10px;
  z-index:5;
}

.flame{
  position:absolute;
  top:-32px;
  left:50%;
  transform:translateX(-50%);
  width:26px;
  height:36px;
  background:radial-gradient(circle,#fff7cc,#ff7b00);
  border-radius:50%;
  animation:flicker .25s infinite;
}

/* 🔪 PROPER KNIFE (TOP DOWN) */
.knife{
  position:absolute;
  top:-160px;
  left:50%;
  transform:translateX(-50%);
  width:12px;
  height:140px;
  background:linear-gradient(#eee,#aaa);
  border-radius:6px;
  display:none;
  animation:cutDown 2s ease forwards;
}

/* 🎊 CONFETTI */
.confetti{
  position:fixed;
  top:-10px;
  width:10px;
  height:14px;
  animation:fall 4s linear forwards;
}

/* 📜 MESSAGE PAGE */
.message-box{
  max-height:65vh;
  overflow-y:auto;
  text-align:left;
  line-height:1.8;
  color:#5a1a2c;
  padding-right:8px;
}

/* ANIMATIONS */
@keyframes fadeIn{
  from{opacity:0;transform:scale(.95)}
  to{opacity:1;transform:scale(1)}
}
@keyframes glow{
  from{text-shadow:0 0 10px #ff2f92}
  to{text-shadow:0 0 30px #ff2f92}
}
@keyframes flicker{
  0%{transform:translateX(-50%) scale(1)}
  50%{transform:translateX(-50%) scale(.85)}
  100%{transform:translateX(-50%) scale(1)}
}
@keyframes cutDown{
  to{top:120px}
}
@keyframes fall{
  to{transform:translateY(120vh) rotate(360deg)}
}
</style>
</head>

<body>

<audio id="music1" loop src="calm.mp3"></audio>
<audio id="music2" src="celebration.mp3"></audio>

<!-- PAGE 1 -->
<div class="screen" id="page1">
  <div class="card">
    <h1>🎉 Happy Birthday Geet 🎉</h1>
    <p>Tap to open 🎂</p>
    <button onclick="openCake()">Open</button>
  </div>
</div>

<!-- PAGE 2 -->
<div class="screen hidden" id="page2">
  <div class="card">
    <h2>Blow the candle 🕯️</h2>

    <div class="cake">
      <div class="candle">
        <div class="flame" id="flame"></div>
      </div>

      <div class="top">
        <div class="name">Geet 💖</div>
        <div class="drips">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="body"></div>
      <div class="stand"></div>

      <div class="knife" id="knife"></div>
    </div>

    <p>Blow into your mic 🎤</p>
    <button id="cutBtn" class="hidden" onclick="cutCake()">Cut the Cake 🎂</button>
  </div>
</div>

<!-- PAGE 3 -->
<div class="screen hidden" id="page3">
  <div class="card">
    <h2>💖 For You</h2>
    <div class="message-box">
      <p>
        Happy Birthday Geet ❤️  
        Write your full long birthday message here… scrollable page for all your wishes!
      </p>
    </div>
    <button onclick="goBackToStart()">⬅ Go Back</button>
  </div>
</div>

<script>
let blown=false, audioCtx, analyser;

function openCake(){
  page1.classList.add("hidden");
  page2.classList.remove("hidden");
  music1.play();
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    audioCtx=new AudioContext();
    analyser=audioCtx.createAnalyser();
    const mic=audioCtx.createMediaStreamSource(stream);
    mic.connect(analyser);
    analyser.fftSize=256;
    detectBlow();
  });
}

function detectBlow(){
  const data=new Uint8Array(analyser.frequencyBinCount);
  function check(){
    analyser.getByteFrequencyData(data);
    let vol=data.reduce((a,b)=>a+b)/data.length;
    if(vol>60 && !blown){
      blown=true;
      flame.style.display="none";
      music1.pause();
      music2.play();
      confetti();
      cutBtn.classList.remove("hidden");
    }
    requestAnimationFrame(check);
  }
  check();
}

function cutCake(){
  knife.style.display="block";
  setTimeout(()=>{
    page2.classList.add("hidden");
    page3.classList.remove("hidden");
  },2000);
}

function confetti(){
  for(let i=0;i<90;i++){
    let c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=`hsl(${Math.random()*360},100%,60%)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4000);
  }
}

function goBackToStart(){
  page3.classList.add("hidden");
  page1.classList.remove("hidden");
  // reset cake/knife for replay
  blown=false;
  flame.style.display="block";
  knife.style.display="none";
  cutBtn.classList.add("hidden");
  music2.pause();
  music1.currentTime = 0;
}
</script>

</body>
</html>
