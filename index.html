<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Geet</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #EEF5F0;
  --card: #BFD8C2;
  --primary: #9CAF88;
  --accent: #7FA58C;
  --text: #2E4A3B;
}

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%; overflow:hidden;
  background:var(--bg);
  font-family:'Montserrat',sans-serif;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

/* TIMER */
#timer3to1 { font-size:6rem; font-weight:600; color:var(--primary); }

/* TEXT */
#birthday-text { display:none; font-family:'Playfair Display',serif; font-size:4rem; color:var(--primary); text-align:center; }
#sub-text { display:none; font-size:1.4rem; max-width:90%; text-align:center; margin:15px 0; }
#second-timer { display:none; font-size:2.5rem; font-weight:600; }

/* BUTTON */
#start-btn { display:none; margin-top:25px; padding:15px 35px; border-radius:50px; border:none; background:var(--accent); color:white; font-size:1.3rem; font-weight:600; cursor:pointer; }

/* BALLOONS */
.balloon { position:absolute; bottom:-50px; font-size:2rem; animation: floatUp 6s linear forwards; z-index:0; }
@keyframes floatUp { to { transform:translateY(-110vh); opacity:0; } }

/* BOOK */
#book-container { display:none; width:75vw; max-width:600px; height:60vh; background:var(--card); border-radius:16px; padding:30px; text-align:center; }
#page-title { font-family:'Playfair Display',serif; font-size:2.6rem; color:var(--primary); }
#page-content { margin-top:15px; font-size:1.3rem; line-height:2.1rem; max-height:32vh; overflow-y:auto; }
.book-buttons { margin-top:20px; display:flex; justify-content:space-between; }
.book-buttons button { padding:10px 22px; border-radius:30px; border:none; background:var(--accent); color:white; font-weight:600; cursor:pointer; }

</style>
</head>

<body>

<div id="timer3to1">3</div>
<div id="birthday-text">Happy Birthday Geet</div>
<div id="sub-text">Today a beautiful lady was born and her name is Geet and even she is not aware of it</div>
<div id="second-timer">15</div>
<button id="start-btn">Open Your Surprise</button>

<div id="book-container">
  <h1 id="page-title"></h1>
  <div id="page-content"></div>
  <div class="book-buttons">
    <button onclick="prevPage()">⬅ Previous</button>
    <button onclick="nextPage()">Next ➡</button>
  </div>
</div>

<!-- SONGS -->
<audio id="song-hbd">
  <source src="🎈 Happy Happy Birthday_ 🎂 I Wish You a Very Very Happy Birthday___(M4A_128K).m4a" type="audio/mpeg">
</audio>
<audio id="song-blue" loop>
  <source src="yung kai - blue (official music video)(M4A_128K).m4a" type="audio/mpeg">
</audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
const timer3to1 = document.getElementById("timer3to1");
const birthdayText = document.getElementById("birthday-text");
const subText = document.getElementById("sub-text");
const secondTimer = document.getElementById("second-timer");
const startBtn = document.getElementById("start-btn");
const book = document.getElementById("book-container");

const songHBD = document.getElementById("song-hbd");
const songBlue = document.getElementById("song-blue");

let count = 3;
const mainTimer = setInterval(() => {
  count--;
  if(count>0) timer3to1.innerText = count;
  else {
    clearInterval(mainTimer);
    timer3to1.style.display = "none";
    birthdayText.style.display = "block";
    subText.style.display = "block";
    secondTimer.style.display = "block";
    confetti();
    balloons();
    startSecond();
    songHBD.play(); // play Happy Birthday song
  }
}, 1000);

function startSecond() {
  let s = 15;
  secondTimer.innerText = s;
  const t = setInterval(() => {
    s--;
    if(s >= 0) secondTimer.innerText = s;
    else {
      clearInterval(t);
      startBtn.style.display = "inline-block";
    }
  }, 1000);
}

startBtn.onclick = () => {
  birthdayText.style.display = "none";
  subText.style.display = "none";
  secondTimer.style.display = "none";
  startBtn.style.display = "none";
  book.style.display = "block";

  songHBD.pause();      // stop HBD song
  songBlue.play();      // play Blue song

  renderPage();
};

function balloons() {
  setInterval(() => {
    const b = document.createElement("div");
    b.className = "balloon";
    b.innerHTML = "🎈";
    b.style.left = Math.random()*90 + "vw";
    document.body.appendChild(b);
    setTimeout(()=>b.remove(),6000);
  },500);
}

/* BOOK DATA */
const pages = [
  { title:"Happy Birthday Geet 💖", content:`Hiii Geet Rani Happy Birthday 🎈🎂, How aree youu Geet? I hope you are fine and doing well. I have made this website to wish you a very happy birthday and this is the only way to wish you and one of my favorite way to wish you, so Happy Birthday Geet. Always stay happy and keep smiling because you look even more beautiful when you are smiling..
And I will always pray for your betterment, success. Goodluck for the Board Exams.` },
  { title:"Why do I love you? 💗", content:`Okay so why do I love you? This time I'm saying this openly last time I said that I liked you but actually I love you and It's not only because that you are beautiful there are many reasons and the very main reason is that you are the first girl in my life whom I love and first love cannot be forgotten. You know the backstory that where I first saw you then fell in love with you but couldn't tell you that I was in love with you and then someone else stole you from mee and that's where I was heartbroken for the first time ever in my life and I still think that it was all my fault that I should have told you about it but I was too scared even I'm scared right now making this gift for you but I don't wanna lose you this time that's why I'm doing all this for you.` },
  { title:"What can I do for you? 💝", content:`Hey Geet, ... (rest of your content)` },
  { title:"My Poetries for You ✍🏻", content:`I just want you to know something... (rest of your content)` },
  { title:"A Wish for You 💗", content:`Geet, On your special day, I just want to tell you how truly amazing you are... (rest of your content)` },
  { title:"A Note for You, Geet 💝", content:`Geet, I know sometimes your heart still carries shadows of the past... (rest of your content)` },
];

let i=0;
const title = document.getElementById("page-title");
const content = document.getElementById("page-content");

function renderPage() {
  title.innerText = pages[i].title;
  content.innerText = pages[i].content;
  content.scrollTop = 0;
}

function nextPage(){ if(i<pages.length-1) i++; renderPage(); }
function prevPage(){ if(i>0) i--; renderPage(); }

</script>
</body>
</html>
