<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Aapi</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #EEF5F0;
  --card: #BFD8C2;
  --primary: #9CAF88;
  --accent: #7FA58C;
  --text: #2E4A3B;
}

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%; overflow:hidden;
  background:var(--bg);
  font-family:'Montserrat',sans-serif;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

/* TIMER */
#timer3to1 { font-size:6rem; font-weight:600; color:var(--primary); }

/* TEXT */
#birthday-text { display:none; font-family:'Playfair Display',serif; font-size:4rem; color:var(--primary); text-align:center; }
#sub-text { display:none; font-size:1.4rem; max-width:90%; text-align:center; margin:15px 0; }
#second-timer { display:none; font-size:2.5rem; font-weight:600; }

/* BUTTONS */
#play-btn, #start-btn {
  display:none;
  margin-top:25px;
  padding:15px 35px;
  border-radius:50px;
  border:none;
  background:var(--accent);
  color:white;
  font-size:1.3rem;
  font-weight:600;
  cursor:pointer;
}

/* BALLOONS */
.balloon {
  position:absolute;
  bottom:-50px;
  font-size:2rem;
  animation: floatUp 6s linear forwards;
  z-index:0;
}
@keyframes floatUp {
  to { transform:translateY(-110vh); opacity:0; }
}

/* BOOK */
#book-container {
  display:none;
  width:75vw;
  max-width:600px;
  height:60vh;
  background:var(--card);
  border-radius:16px;
  padding:30px;
  text-align:center;
}
#page-title {
  font-family:'Playfair Display',serif;
  font-size:2.6rem;
  color:var(--primary);
}
#page-content {
  margin-top:15px;
  font-size:1.3rem;
  line-height:2.1rem;
  max-height:32vh;
  overflow-y:auto;
}
.book-buttons {
  margin-top:20px;
  display:flex;
  justify-content:space-between;
}
.book-buttons button {
  padding:10px 22px;
  border-radius:30px;
  border:none;
  background:var(--accent);
  color:white;
  font-weight:600;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="timer3to1">3</div>
<div id="birthday-text">Happy Birthday Aapi 🎉</div>
<div id="sub-text">
  Today a beautiful soul was born — my Aapi 💖  
  A sister who makes life warmer just by being herself.
</div>
<div id="second-timer">15</div>

<button id="play-btn">Play Birthday Song 🎵</button>
<button id="start-btn">Open Your Surprise</button>

<div id="book-container">
  <h1 id="page-title"></h1>
  <div id="page-content"></div>
  <div class="book-buttons">
    <button onclick="prevPage()">⬅ Previous</button>
    <button onclick="nextPage()">Next ➡</button>
  </div>
</div>

<!-- SONGS -->
<audio id="song-hbd">
  <source src="hbd.m4a" type="audio/mp4">
</audio>
<audio id="song-soft" loop>
  <source src="soft.m4a" type="audio/mp4">
</audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const timer3to1 = document.getElementById("timer3to1");
const birthdayText = document.getElementById("birthday-text");
const subText = document.getElementById("sub-text");
const secondTimer = document.getElementById("second-timer");
const playBtn = document.getElementById("play-btn");
const startBtn = document.getElementById("start-btn");
const book = document.getElementById("book-container");

const songHBD = document.getElementById("song-hbd");
const songSoft = document.getElementById("song-soft");

let count = 3;
const mainTimer = setInterval(() => {
  count--;
  if (count > 0) {
    timer3to1.innerText = count;
  } else {
    clearInterval(mainTimer);
    timer3to1.style.display = "none";
    birthdayText.style.display = "block";
    subText.style.display = "block";
    secondTimer.style.display = "block";
    confetti();
    balloons();
    startSecond();
  }
}, 1000);

function startSecond() {
  let s = 15;
  secondTimer.innerText = s;
  const t = setInterval(() => {
    s--;
    if (s >= 0) secondTimer.innerText = s;
    else {
      clearInterval(t);
      playBtn.style.display = "inline-block"; // show button after countdown
    }
  }, 1000);
}

// Play Happy Birthday when user clicks button
playBtn.onclick = () => {
  songHBD.play();
  playBtn.style.display = "none";
  startBtn.style.display = "inline-block"; // show next button
};

// Open book and start soft music
startBtn.onclick = () => {
  birthdayText.style.display = "none";
  subText.style.display = "none";
  secondTimer.style.display = "none";
  startBtn.style.display = "none";
  book.style.display = "block";

  songHBD.pause(); // stop HBD if still playing
  songSoft.play();

  renderPage();
};

function balloons() {
  setInterval(() => {
    const b = document.createElement("div");
    b.className = "balloon";
    b.innerHTML = "🎈";
    b.style.left = Math.random() * 90 + "vw";
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 6000);
  }, 500);
}

/* BOOK DATA */
const pages = [
  {
    title: "Happy Birthday Aapi 💖",
    content: `Hiii my dearest Aapi 🎂🎈
Happy Birthday to someone who may not be connected to me by blood,
but is deeply connected to my heart.
People say family is defined by blood,
but you proved to me that family is actually defined by love, care, and presence.
You are my sister not because life decided it for us,
but because my heart chose you.
Today is your special day, and I want you to know how incredibly grateful I am to have you in my life. Your presence has brought warmth, comfort, and strength to my journey.`
  },
  {
    title: "My Sister by Heart 🤍",
    content: `Aapi,
You are not my sister by blood, but you are my sister by heart, and that bond feels stronger than many blood relationships. You became someone I trust, someone I respect, and someone I feel safe around.`
  },
  {
    title: "Thank You for Being There 🌸",
    content: `Aapi,
There are moments in life when support matters more than words, and you were always there. You supported me when I felt unsure, helped me feel less alone, and guided me when I was lost. I am truly thankful for everything you have done for me.`
  },
  {
    title: "You Changed Me 💫",
    content: `Aapi,
Your support has played a big role in shaping the person I am becoming. You didn’t try to control my path — you trusted me. You didn’t pressure me — you encouraged me. You didn’t judge me — you understood me.`
  },
  {
    title: "I Admire You So Much 🤍",
    content: `Aapi,
I admire your strength, your maturity, and the way you handle responsibilities with grace. You are strong even when life is heavy, calm when things are stressful, and kind even when the world isn’t kind back.`
  },
  {
    title: "A Promise From My Heart 💖",
    content: `Aapi,
Just like you chose to support me, I choose to always stand by you. You may not be my blood-related sister, but you are my family in the truest sense.`
  },
  {
    title: "Once Again 🎉",
    content: `Happy Birthday once again, my dear Aapi 💖
I wish you a life filled with peace, happiness, and success.
Thank you for being my sister by heart.
With endless love, respect, and gratitude,
— Vishal 🤍`
  }
];

let i = 0;
const title = document.getElementById("page-title");
const content = document.getElementById("page-content");

function renderPage() {
  title.innerText = pages[i].title;
  content.innerText = pages[i].content;
  content.scrollTop = 0;
}

function nextPage() {
  if (i < pages.length - 1) i++;
  renderPage();
}
function prevPage() {
  if (i > 0) i--;
  renderPage();
}
</script>

</body>
</html>
