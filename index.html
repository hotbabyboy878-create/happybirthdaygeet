<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Geet</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #F4C2D7; /* blush pink */
  font-family: 'Montserrat', sans-serif;
  color: #2b2b2b;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

/* TIMER 3 2 1 */
#timer3to1 {
  font-size: 6rem;
  font-weight: 600;
  text-shadow: 0 0 20px #e99abf;
}

/* BIRTHDAY TEXT */
#birthday-text {
  display: none;
  font-family: 'Playfair Display', serif;
  font-size: 4rem;
  color: #c94f8d;
  text-align: center;
  margin-bottom: 10px;
}

#sub-text {
  display: none;
  font-size: 1.5rem;
  text-align: center;
  max-width: 90%;
  margin-bottom: 20px;
}

/* SECOND TIMER */
#second-timer {
  display: none;
  font-size: 2.5rem;
  font-weight: 600;
  margin-bottom: 30px;
}

/* BUTTON */
#start-btn {
  display: none;
  padding: 15px 35px;
  font-size: 1.3rem;
  border: none;
  border-radius: 50px;
  background: linear-gradient(45deg, #EFB3CC, #F6CCD9);
  color: #2b2b2b;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 0 20px #e7a7c5;
}

#start-btn:hover {
  transform: scale(1.05);
}

/* BALLOONS */
.balloon {
  position: absolute;
  bottom: -50px;
  font-size: 2rem;
  animation: floatUp 6s linear forwards;
  z-index: 0;
}

@keyframes floatUp {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-110vh); opacity: 0; }
}

/* BOOK */
#book-container {
  display: none;
  width: 75vw;
  max-width: 600px;
  height: 60vh;
  background: #FBE4EC;
  border-radius: 15px;
  padding: 30px;
  box-shadow: 0 0 40px rgba(201,79,141,0.3);
  text-align: center;
  z-index: 1;
}

#page-title {
  font-family: 'Playfair Display', serif;
  font-size: 2.8rem;
  color: #c94f8d;
  margin-bottom: 15px;
}

#page-content {
  font-size: 1.3rem;
  line-height: 2.2rem;
  max-height: 32vh;
  overflow-y: auto;
  padding-right: 10px;
}

/* BOOK BUTTONS */
.book-buttons {
  margin-top: 20px;
  display: flex;
  justify-content: space-between;
}

.book-buttons button {
  padding: 10px 22px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  background: linear-gradient(45deg, #EFB3CC, #F6CCD9);
  color: #2b2b2b;
  font-weight: 600;
  box-shadow: 0 0 15px #e7a7c5;
}
</style>
</head>

<body>

<div id="timer3to1">3</div>

<div id="birthday-text">Happy Birthday Geet</div>

<div id="sub-text">
  Today a beautiful lady was born and her name is Geet and even she is not aware of it
</div>

<div id="second-timer">15</div>

<button id="start-btn">✨ Open Your Surprise ✨</button>

<!-- BOOK -->
<div id="book-container">
  <h1 id="page-title"></h1>
  <div id="page-content"></div>

  <div class="book-buttons">
    <button onclick="prevPage()">⬅ Previous</button>
    <button onclick="nextPage()">Next ➡</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const timer3to1 = document.getElementById("timer3to1");
const birthdayText = document.getElementById("birthday-text");
const subText = document.getElementById("sub-text");
const secondTimer = document.getElementById("second-timer");
const startBtn = document.getElementById("start-btn");
const bookContainer = document.getElementById("book-container");

let count = 3;
const countdown = setInterval(() => {
  count--;
  if (count > 0) {
    timer3to1.innerText = count;
  } else {
    clearInterval(countdown);
    timer3to1.style.display = "none";
    birthdayText.style.display = "block";
    subText.style.display = "block";
    secondTimer.style.display = "block";
    launchConfetti();
    spawnBalloons();
    startSecondTimer();
  }
}, 1000);

function startSecondTimer() {
  let sec = 15;
  secondTimer.innerText = sec;
  const t = setInterval(() => {
    sec--;
    if (sec >= 0) secondTimer.innerText = sec;
    else {
      clearInterval(t);
      startBtn.style.display = "inline-block";
    }
  }, 1000);
}

startBtn.onclick = () => {
  birthdayText.style.display = "none";
  subText.style.display = "none";
  secondTimer.style.display = "none";
  startBtn.style.display = "none";
  bookContainer.style.display = "block";
  renderPage();
};

function launchConfetti() {
  confetti({ particleCount: 200, spread: 360, origin: { y: 0.6 } });
}

function spawnBalloons() {
  setInterval(() => {
    const b = document.createElement("div");
    b.className = "balloon";
    b.innerHTML = "🎈";
    b.style.left = Math.random() * 90 + "vw";
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 6000);
  }, 500);
}

/* BOOK CONTENT */
const pages = [
  {
    title: "Happy Birthday Geet 💖",
    content: `Hiii Geet Rani, Happy Birthday 🎂  
I made this website only for you.  
Always stay happy and keep smiling.`
  },
  {
    title: "Why do I love you? 💗",
    content: `This is where you can write anything you want.  
Add as much text as you like — this page is scrollable.`
  },
  {
    title: "A Wish For You 🎉",
    content: "May your life be filled with love, success, and happiness always."
  }
];

let currentPage = 0;
const pageTitle = document.getElementById("page-title");
const pageContent = document.getElementById("page-content");

function renderPage() {
  pageTitle.innerText = pages[currentPage].title;
  pageContent.innerText = pages[currentPage].content;
  pageContent.scrollTop = 0;
}

function nextPage() {
  if (currentPage < pages.length - 1) {
    currentPage++;
    renderPage();
  }
}

function prevPage() {
  if (currentPage > 0) {
    currentPage--;
    renderPage();
  }
}
</script>

</body>
</html>
