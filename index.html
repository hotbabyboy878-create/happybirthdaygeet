<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Geet</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>

/* =====================================================
   THEME
   ===================================================== */

/* 🌹 Sage / Mint */
:root {
  --bg: #EEF5F0;
  --card: #BFD8C2;
  --primary: #9CAF88;
  --accent: #7FA58C;
  --text: #2E4A3B;
}

/* ===================================================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: 'Montserrat', sans-serif;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

/* TIMER */
#timer3to1 {
  font-size: 6rem;
  font-weight: 600;
  color: var(--primary);
}

/* TEXT */
#birthday-text {
  display: none;
  font-family: 'Playfair Display', serif;
  font-size: 4rem;
  color: var(--primary);
  text-align: center;
}

#sub-text {
  display: none;
  font-size: 1.4rem;
  max-width: 90%;
  text-align: center;
  margin: 15px 0;
}

#second-timer {
  display: none;
  font-size: 2.5rem;
  font-weight: 600;
}

/* BUTTON */
#start-btn {
  display: none;
  margin-top: 25px;
  padding: 15px 35px;
  border-radius: 50px;
  border: none;
  background: var(--accent);
  color: white;
  font-size: 1.3rem;
  font-weight: 600;
  cursor: pointer;
}

/* BALLOONS */
.balloon {
  position: absolute;
  bottom: -50px;
  font-size: 2rem;
  animation: floatUp 6s linear forwards;
  z-index: 0;
}

@keyframes floatUp {
  to {
    transform: translateY(-110vh);
    opacity: 0;
  }
}

/* BOOK */
#book-container {
  display: none;
  width: 80vw;
  max-width: 800px;
  height: 75vh;
  background: var(--card);
  border-radius: 16px;
  padding: 35px 30px;
  text-align: center;
  overflow: hidden;
  position: relative;
}

#page-title {
  font-family: 'Playfair Display', serif;
  font-size: 3rem;
  color: var(--primary);
}

#page-content {
  margin-top: 20px;
  font-size: 1.35rem;
  line-height: 2.2rem;
  max-height: 57vh;
  overflow-y: auto;
  padding-right: 10px;
  text-align: left;
}

/* BOOK BUTTONS */
.book-buttons {
  margin-top: 20px;
  display: flex;
  justify-content: space-between;
}

.book-buttons button {
  padding: 10px 22px;
  border-radius: 30px;
  border: none;
  background: var(--accent);
  color: white;
  font-weight: 600;
  cursor: pointer;
}

</style>
</head>

<body>

<div id="timer3to1">3</div>

<div id="birthday-text">Happy Birthday Geet</div>

<div id="sub-text">
  Today a beautiful lady was born and her name is Geet and even she is not aware of it
</div>

<div id="second-timer">15</div>

<button id="start-btn">Open Your Surprise</button>

<div id="book-container">
  <h1 id="page-title"></h1>
  <div id="page-content"></div>

  <div class="book-buttons">
    <button onclick="prevPage()">⬅ Previous</button>
    <button onclick="nextPage()">Next ➡</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const timer3to1 = document.getElementById("timer3to1");
const birthdayText = document.getElementById("birthday-text");
const subText = document.getElementById("sub-text");
const secondTimer = document.getElementById("second-timer");
const startBtn = document.getElementById("start-btn");
const book = document.getElementById("book-container");

let count = 3;
const mainTimer = setInterval(() => {
  count--;
  if (count > 0) timer3to1.innerText = count;
  else {
    clearInterval(mainTimer);
    timer3to1.style.display = "none";
    birthdayText.style.display = "block";
    subText.style.display = "block";
    secondTimer.style.display = "block";
    confetti();
    balloons();
    startSecond();
  }
}, 1000);

function startSecond() {
  let s = 15;
  secondTimer.innerText = s;
  const t = setInterval(() => {
    s--;
    if (s >= 0) secondTimer.innerText = s;
    else {
      clearInterval(t);
      startBtn.style.display = "inline-block";
    }
  }, 1000);
}

startBtn.onclick = () => {
  birthdayText.style.display = "none";
  subText.style.display = "none";
  secondTimer.style.display = "none";
  startBtn.style.display = "none";
  book.style.display = "block";
  renderPage();
};

function balloons() {
  setInterval(() => {
    const b = document.createElement("div");
    b.className = "balloon";
    b.innerHTML = "🎈";
    b.style.left = Math.random() * 90 + "vw";
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 6000);
  }, 500);
}

/* BOOK DATA */
const pages = [
  { title: "Happy Birthday Geet 💖", content: `Hiii Geet Rani Happy Birthday 🎈🎂, How aree youu Geet? I hope you are fine and doing well. I have made this website to wish you a very happy birthday and this is the only way to wish you and one of my favorite way to wish you, so Happy Birthday Geet. Always stay happy and keep smiling because you look even more beautiful when you are smiling..
And I will always pray for your betterment, success. Goodluck for the Board Exams.` },
  { title: "Why do I love you? 💗", content: `Okay so why do I love you? This time I'm saying this openly last time I said that I liked you but actually I love you and It's not only because that you are beautiful there are many reasons and the very main reason is that you are the first girl in my life whom I love and first love cannot be forgotten...` },
  { title: "What can I do for you and who are you to me? 💝", content: `Hey Geet,
I hope you take a moment to read this slowly,
because these are all the thoughts I’ve kept in my heart for so long...
You are my happiness, my peace, my reason to smile...
I want you to know that I can do anything for you...
I am willing to change myself for you...
If you want me to wait, I will wait...
I just want to be someone who genuinely cares for you...` },
  { title: "My Poetries for You (My First Act of Love) ✍🏻", content: `I just want you to know something.
Writing poetries is not easy for me. Not at all...
Every poetry I wrote, was my way of trying to make you smile...
It was my first act of love.` },
  { title: "A Wish for You 💗", content: `Geet,
On your special day, I just want to tell you how truly amazing you are...
I wish that every moment of your life is filled with happiness...
Happy Birthday, Geet 🎉💖` },
  { title: "A Note for You, Geet — Your Heart Deserves Happiness 💝", content: `Geet,
I know sometimes your heart still carries shadows of the past...
You are beautiful, kind, strong, and full of light...
I promise, Geet, if you let your heart open even a little...
Your heart is precious, and I’ll be here, hoping to be the one who makes your days brighter...` },
];

let i = 0;
const title = document.getElementById("page-title");
const content = document.getElementById("page-content");

function renderPage() {
  title.innerText = pages[i].title;
  content.innerText = pages[i].content;
  content.scrollTop = 0;
}

function nextPage() {
  if (i < pages.length - 1) i++;
  renderPage();
}

function prevPage() {
  if (i > 0) i--;
  renderPage();
}
</script>

</body>
</html>
