<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Geet</title>

<link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Poppins:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  font-family: 'Poppins', sans-serif;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

/* TEXT */
#timer3to1 {
  font-size: 6rem;
  text-shadow: 0 0 20px #ff69b4;
}

#birthday-text {
  display: none;
  font-family: 'Sacramento', cursive;
  font-size: 4rem;
  color: #ff69b4;
  text-align: center;
  margin-bottom: 10px;
}

#sub-text {
  display: none;
  font-size: 1.6rem;
  text-align: center;
  max-width: 90vw;
  margin-bottom: 20px;
}

#second-timer {
  display: none;
  font-size: 2.5rem;
  margin-bottom: 30px;
}

/* BUTTON */
#start-btn {
  display: none;
  padding: 15px 35px;
  font-size: 1.4rem;
  border: none;
  border-radius: 50px;
  background: linear-gradient(45deg, #ff69b4, #ff4500);
  color: white;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 20px #ff69b4;
}

#start-btn:hover {
  transform: scale(1.05);
}

/* BALLOONS */
.balloon {
  position: absolute;
  bottom: 0;
  font-size: 2rem;
  animation: floatUp 6s linear forwards;
  z-index: 0;
}

@keyframes floatUp {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-110vh); opacity: 0; }
}

/* BOOK */
#book-container {
  display: none;
  width: 70vw;
  max-width: 600px;
  height: 60vh;
  background: #222;
  border-radius: 12px;
  padding: 30px;
  box-shadow: 0 0 40px rgba(255,255,255,0.2);
  z-index: 1;
  text-align: center;
}

#page-title {
  font-family: 'Sacramento', cursive;
  font-size: 3rem;
  color: #ff69b4;
  margin-bottom: 15px;
}

#page-content {
  font-size: 1.4rem;
  line-height: 2.2rem;
  max-height: 32vh;
  overflow-y: auto;
  padding-right: 10px;
}

/* BOOK BUTTONS */
.book-buttons {
  margin-top: 20px;
  display: flex;
  justify-content: space-between;
}

.book-buttons button {
  padding: 10px 22px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  background: linear-gradient(45deg, #ff69b4, #ff4500);
  color: white;
  font-weight: bold;
  box-shadow: 0 0 15px #ff69b4;
}

.book-buttons button:hover {
  transform: scale(1.05);
}
</style>
</head>

<body>

<div id="timer3to1">3</div>

<div id="birthday-text">Happy Birthday Geet 🎉</div>
<div id="sub-text">
  Today a beautiful lady was born and her name is Geet and even she is not aware of it
</div>
<div id="second-timer">15</div>

<button id="start-btn">✨ Open Your Surprise ✨</button>

<!-- BOOK -->
<div id="book-container">
  <h1 id="page-title"></h1>
  <div id="page-content"></div>

  <div class="book-buttons">
    <button onclick="prevPage()">⬅ Previous</button>
    <button onclick="nextPage()">Next ➡</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const timer3to1 = document.getElementById("timer3to1");
const birthdayText = document.getElementById("birthday-text");
const subText = document.getElementById("sub-text");
const secondTimer = document.getElementById("second-timer");
const startBtn = document.getElementById("start-btn");
const bookContainer = document.getElementById("book-container");

let count = 3;
const countdown = setInterval(() => {
  count--;
  if (count > 0) {
    timer3to1.innerText = count;
  } else {
    clearInterval(countdown);
    timer3to1.style.display = "none";
    birthdayText.style.display = "block";
    subText.style.display = "block";
    secondTimer.style.display = "block";
    launchConfetti();
    spawnBalloons();
    startSecondTimer();
  }
}, 1000);

function startSecondTimer() {
  let sec = 15;
  secondTimer.innerText = sec;
  const t = setInterval(() => {
    sec--;
    if (sec >= 0) secondTimer.innerText = sec;
    else {
      clearInterval(t);
      startBtn.style.display = "inline-block";
    }
  }, 1000);
}

startBtn.onclick = () => {
  birthdayText.style.display = "none";
  subText.style.display = "none";
  secondTimer.style.display = "none";
  startBtn.style.display = "none";
  bookContainer.style.display = "block";
  renderPage();
};

function launchConfetti() {
  confetti({
    particleCount: 200,
    spread: 360,
    origin: { y: 0.6 }
  });
}

function spawnBalloons() {
  setInterval(() => {
    const b = document.createElement("div");
    b.className = "balloon";
    b.innerHTML = "🎈";
    b.style.left = Math.random() * 90 + "vw";
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 6000);
  }, 500);
}

/* BOOK LOGIC */
const pages = [
  {
    title: "Happy Birthday Geet 💖",
    content: "Hiii Geet Rani Happy Birthday 🎈🎂, Kaisi ho I hope ke thik ho. Yeh phir se ek gift banaya hai tumhare liye kyuke aaj tumhari birthday hai iss website ke zariye tumhe batana chahta hu ke tum mere liye kitni important ho aur mujhe jo aata hai ussi ke zariye hi tumhe khush krna chahta tha toh yeh website bana di kyuke aur kuch toh aata nhi mujhe..
Aur mujhe tumhari problems, pareshaniyan past traumas, aur tumhari weaknesses ka pata nhi isiliye mujhe nhi pata ke kya kehna chahiye mujhe mein bs yahi kehna chahta hu ke hamesha khush rehna aur muskarati rehna aur kabhi bhi khud ko kam mat smjhna kisi se bhi tum sabse khubsurat aur achi larki ho aur class mein toh bilkul bhi mat smjhna khud ko kam tumhara koi comparison hi nhi hai class ki larkiyon mein woh sab neeche hain aur tum unsab se uper ho. Tumhe yeh sab likh kr tumhe tumhari value batana chahta hu mein kyuke tum ho hi waisi mujhe bhi pagal krdiya hai 😭. Har pal bs yahi sochta hu ke Geet ko kese manaunga mein aur mehak didi ko toh tumhari baatein bata bata kr pagal hi krdiya.
Yeh website pichli baar wali se bhi achi banane ki koshish ki hai maine aur I hope ke tumhe achi lagegi.
Tumhe pata nhi kyu yeh sab cringe lagta hai mein itna pyaar se sab kuch krta hu tumhare liye aur tum cringe bol deti ho 😭😭."
  },
  {
    title: "A Special Day ✨",
    content: "Today is not just a birthday. It’s a reminder of how special you are to everyone around you."
  },
  {
    title: "What Makes You Special 🌸",
    content: "Your kindness, your smile, and the warmth you bring into people’s lives."
  },
  {
    title: "A Wish For You 🎉",
    content: "May your life be filled with love, laughter, dreams fulfilled, and happiness beyond measure."
  }
];

let currentPage = 0;
const pageTitle = document.getElementById("page-title");
const pageContent = document.getElementById("page-content");

function renderPage() {
  pageTitle.innerText = pages[currentPage].title;
  pageContent.innerText = pages[currentPage].content;
  pageContent.scrollTop = 0;
}

function nextPage() {
  if (currentPage < pages.length - 1) {
    currentPage++;
    renderPage();
  }
}

function prevPage() {
  if (currentPage > 0) {
    currentPage--;
    renderPage();
  }
}
</script>

</body>
</html>
