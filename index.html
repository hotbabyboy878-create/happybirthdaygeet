<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Geet 🎂</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* General Body Styles */
body {
  margin:0;
  font-family: "Georgia", serif;
  background: radial-gradient(circle at top, #ffe1ec, #ff6f9f);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  text-align: center;
}

/* Countdown Page */
.screen {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
}

/* Countdown Timer */
#countdown {
  font-size: 96px;
  font-weight: bold;
  color: #ff2f92;
  animation: scaleUp 0.5s ease;
}

@keyframes scaleUp {
  0% {
    transform: scale(0);
  }
  50% {
    transform: scale(1.2);
  }
  100% {
    transform: scale(1);
  }
}

/* Happy Birthday Message */
#happyMessage {
  font-size: 48px;
  font-weight: bold;
  color: #ff2f92;
  text-shadow: 0 0 15px #ff6f9f;
  opacity: 0;
  animation: fadeInText 2s ease forwards;
}

@keyframes fadeInText {
  from {
    opacity: 0;
    transform: scale(0.5);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* Confetti Animation */
.confetti {
  position: fixed;
  top: -10px;
  width: 10px;
  height: 14px;
  animation: fall 4s linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(120vh) rotate(360deg);
  }
}

/* Next Button */
button {
  margin-top: 20px;
  padding: 12px 25px;
  background: #ff4f9a;
  color: white;
  font-size: 18px;
  border-radius: 25px;
  border: none;
  cursor: pointer;
  transition: all 0.3s ease;
}

button:hover {
  background: #ff85b3;
  transform: scale(1.1);
}
</style>
</head>
<body>

<!-- Countdown Page -->
<div class="screen" id="countdownScreen">
  <div id="countdown">5</div>
  <div id="countdownText">Seconds remaining</div>
</div>

<!-- Happy Birthday Page -->
<div class="screen hidden" id="happyScreen">
  <div id="happyMessage">🎉 Happy Birthday Geet 💖 🎉</div>
  <button onclick="nextPage()">Next ➡</button>
</div>

<script>
// Countdown logic
let countdown = 5;
const countdownEl = document.getElementById('countdown');
const countdownText = document.getElementById('countdownText');
const happyMessage = document.getElementById('happyMessage');
const countdownScreen = document.getElementById('countdownScreen');
const happyScreen = document.getElementById('happyScreen');

function startCountdown() {
  const interval = setInterval(() => {
    if (countdown > 1) {
      countdown--;
      countdownEl.innerText = countdown;
    } else {
      clearInterval(interval);
      countdownText.innerText = "Happy Birthday Geet!";
      showHappyMessage();
      showConfetti();
    }
  }, 1000);
}

// Show Happy Birthday message
function showHappyMessage() {
  countdownScreen.classList.add('hidden');
  happyScreen.classList.remove('hidden');
  happyMessage.style.animation = "fadeInText 2s ease forwards";
}

// Confetti effect
function showConfetti() {
  for (let i = 0; i < 80; i++) {
    let c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = `hsl(${Math.random() * 360}, 100%, 60%)`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

// Next button action
function nextPage() {
  alert("Next page will be your message page! More features coming soon!");
}

// Start countdown on load
startCountdown();
</script>

</body>
</html>
