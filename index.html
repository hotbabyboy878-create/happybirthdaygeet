<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy Birthday Geet!</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
}

/* COUNTDOWN SCREEN */
.countdown {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at top, #ff758c, #ff7eb3);
  z-index: 10;
}

.countdown-number {
  font-size: 6rem;
  color: #fff;
  font-weight: bold;
  animation: scaleFade 1s ease-in-out forwards;
  text-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

@keyframes scaleFade {
  0% { transform: scale(0.5); opacity: 0; }
  50% { transform: scale(1.3); opacity: 1; }
  100% { transform: scale(1); opacity: 0; }
}

/* CARD */
.card {
  background: linear-gradient(180deg, #ffffff, #fff5f7);
  width: 320px;
  padding: 26px;
  border-radius: 28px;
  text-align: center;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.2);
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

.balloons {
  font-size: 2.6rem;
  margin-bottom: 10px;
}

.title {
  margin: 8px 0;
  font-size: 2rem;
  color: #ff4f7b;
  font-weight: 800;
  letter-spacing: 1px;
}

.subtitle {
  font-size: 1.1rem;
  color: #ff6f91;
  margin-bottom: 22px;
  font-weight: 600;
  letter-spacing: 0.5px;
  position: relative;
}

.subtitle::before,
.subtitle::after {
  content: "✦";
  color: #ffb3c6;
  margin: 0 8px;
  font-size: 1rem;
}

.surprise-btn {
  position: relative;
  padding: 14px 26px;
  border-radius: 999px;
  border: none;
  font-size: 1.05rem;
  cursor: pointer;
  background: linear-gradient(135deg, #ff5f9e, #ff8fb3);
  color: white;
  font-weight: 600;
  box-shadow: 0 10px 25px rgba(255, 95, 158, 0.5);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  animation: pulse 2s infinite;
}

.surprise-btn:hover {
  transform: translateY(-2px) scale(1.03);
  box-shadow: 0 14px 35px rgba(255, 95, 158, 0.6);
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(255,95,158,0.6); }
  70% { box-shadow: 0 0 0 18px rgba(255,95,158,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,95,158,0); }
}

.footer {
  margin-top: 18px;
  font-size: 0.95rem;
  color: #777;
  animation: fadeIn 0.6s ease forwards;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

  </style>
</head>
<body>  <!-- COUNTDOWN -->  <div class="countdown" id="countdown">
    <div class="countdown-number" id="count">3</div>
  </div>  <!-- CARD -->  <div class="card">
    <div class="balloons">🎈🎉🎂</div>
    <h1 class="title">HAPPY BIRTHDAY GEET</h1>
    <p class="subtitle">A beautiful lady was born today ✨</p>
    <button class="surprise-btn" onclick="showSurprise()">Click for a Surprise</button>
    <div class="footer" id="surprise" style="display:none;">🎁 May your life be filled with love, joy, and endless smiles 💖</div>
  </div>  <script>
    const countEl = document.getElementById('count');
    const countdown = document.getElementById('countdown');
    let count = 3;

    const interval = setInterval(() => {
      count--;
      if (count > 0) {
        countEl.textContent = count;
        countEl.style.animation = 'none';
        void countEl.offsetWidth;
        countEl.style.animation = 'scaleFade 1s ease-in-out forwards';
      } else {
        clearInterval(interval);
        countdown.style.display = 'none';
      }
    }, 1000);

    function showSurprise() {
      document.getElementById('surprise').style.display = 'block';
    }
  </script></body>
</html>
