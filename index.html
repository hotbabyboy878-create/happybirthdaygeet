<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Geet 🎂</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  min-height:100vh;
  font-family:Georgia, serif;
  background: radial-gradient(circle at top, #ffe3ec, #ff6f9f);
  overflow-x:hidden;
}

.center{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  background:rgba(255,255,255,0.45);
  backdrop-filter:blur(18px);
  padding:36px;
  border-radius:36px;
  width:90%;
  max-width:420px;
  text-align:center;
  box-shadow:0 40px 80px rgba(200,70,120,0.4);
  animation:fadeIn 1s ease;
}

button{
  width:100%;
  margin-top:24px;
  padding:16px;
  border:none;
  border-radius:40px;
  font-size:17px;
  background:linear-gradient(135deg,#ff4f9a,#ff85b3);
  color:white;
  cursor:pointer;
}

.hidden{display:none}

/* 🎂 CAKE */
.cake{
  position:relative;
  width:240px;
  margin:40px auto;
}

.layer{
  height:55px;
  background:linear-gradient(to right,#ffb3c6,#ff7aa2);
  border-radius:22px;
  margin-bottom:6px;
}

.icing{
  height:28px;
  background:#fff;
  border-radius:22px;
  margin-bottom:6px;
}

/* 💖 NAME */
.name{
  position:absolute;
  top:12px;
  width:100%;
  text-align:center;
  font-size:24px;
  color:#ff2f92;
  text-shadow:0 0 12px #ff2f92;
  animation:glow 1.6s infinite alternate;
}

/* 🕯️ CANDLE */
.candle{
  position:absolute;
  top:-60px;
  left:50%;
  transform:translateX(-50%);
  width:16px;
  height:50px;
  background:linear-gradient(#ffd700,#ffb700);
  border-radius:10px;
}

.flame{
  position:absolute;
  top:-30px;
  left:50%;
  transform:translateX(-50%);
  width:20px;
  height:28px;
  background:radial-gradient(circle,#fff6b5,#ff8c00);
  border-radius:50%;
  animation:flicker 0.25s infinite;
}

/* 🔪 KNIFE */
.knife{
  position:absolute;
  right:-120px;
  top:60px;
  width:100px;
  height:10px;
  background:#ccc;
  border-radius:6px;
  animation:cut 2s ease forwards;
  display:none;
}

/* 🎊 CONFETTI */
.confetti{
  position:fixed;
  top:-10px;
  width:10px;
  height:14px;
  animation:fall 4s linear forwards;
}

/* ANIMATIONS */
@keyframes fadeIn{
  from{opacity:0;transform:scale(.95)}
  to{opacity:1;transform:scale(1)}
}

@keyframes glow{
  from{text-shadow:0 0 10px #ff2f92}
  to{text-shadow:0 0 25px #ff2f92}
}

@keyframes flicker{
  0%{transform:translateX(-50%) scale(1)}
  50%{transform:translateX(-50%) scale(0.85)}
  100%{transform:translateX(-50%) scale(1)}
}

@keyframes cut{
  to{right:60px}
}

@keyframes fall{
  to{transform:translateY(120vh) rotate(360deg)}
}
</style>
</head>

<body>

<audio id="music1" loop>
  <source src="calm.mp3" type="audio/mpeg">
</audio>

<audio id="music2">
  <source src="celebration.mp3" type="audio/mpeg">
</audio>

<div class="center" id="start">
  <div class="card">
    <h1>🎉 Happy Birthday Geet 🎉</h1>
    <p>Tap to open your surprise 🎂</p>
    <button onclick="start()">Open</button>
  </div>
</div>

<div class="center hidden" id="main">
  <div class="card">
    <h2>Blow the candle 🕯️</h2>

    <div class="cake">
      <div class="name">Geet 💖</div>
      <div class="candle">
        <div class="flame" id="flame"></div>
      </div>

      <div class="icing"></div>
      <div class="layer"></div>
      <div class="icing"></div>
      <div class="layer"></div>

      <div class="knife" id="knife"></div>
    </div>

    <p id="hint">Blow into your mic 🎤</p>
  </div>
</div>

<script>
let blown=false;
let audioCtx, analyser, mic;

function start(){
  document.getElementById("start").classList.add("hidden");
  document.getElementById("main").classList.remove("hidden");
  document.getElementById("music1").play();
  startMic();
}

function startMic(){
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    audioCtx=new AudioContext();
    analyser=audioCtx.createAnalyser();
    mic=audioCtx.createMediaStreamSource(stream);
    mic.connect(analyser);
    analyser.fftSize=256;
    detectBlow();
  });
}

function detectBlow(){
  const data=new Uint8Array(analyser.frequencyBinCount);
  function check(){
    analyser.getByteFrequencyData(data);
    let volume=data.reduce((a,b)=>a+b)/data.length;
    if(volume>60 && !blown){
      blown=true;
      candleOut();
    }
    requestAnimationFrame(check);
  }
  check();
}

function candleOut(){
  document.getElementById("flame").style.display="none";
  document.getElementById("music1").pause();
  document.getElementById("music2").play();
  confetti();
  setTimeout(cutCake,1200);
}

function cutCake(){
  document.getElementById("knife").style.display="block";
}

function confetti(){
  for(let i=0;i<80;i++){
    let c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=`hsl(${Math.random()*360},100%,60%)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4000);
  }
}
</script>

</body>
</html>
